          static void put_f32(uint32_t ad, float f) { uint8_t *p = g2h(ad, 4); uint32_t u; memcpy(&u, &f, 4); if (p) wbe32(p, u); }
          static void ret_point(float x, float y) { if (g_sret) { put_f32(g_sret, x); put_f32(g_sret + 4, y); } }
          static void ret_rect(float x, float y, float w, float h) { if (g_sret) { put_f32(g_sret, x); put_f32(g_sret + 4, y); put_f32(g_sret + 8, w); put_f32(g_sret + 12, h); } }
          static GEvent *ev_find(uint32_t o) { for (int i = 0; i < 16; i++) if (g_ev[i].obj == o) return &g_ev[i]; return NULL; }
          /* koordinat jendela Cocoa: asal di kiri-bawah */
          static float win_x(void) { return (float)g_cur_x; }
          static float win_y(void) { return (float)(600 - g_cur_y); }

          static int sys_msg_input(const char *cn, uint32_t self, const char *sel, uint32_t *a, uint32_t *ret)
          {
              (void)a;
              GEvent *e = ev_find(self);
              if (e) {
                  if (!strcmp(sel, "type")) { *ret = (uint32_t)e->type; return 1; }
                  if (!strcmp(sel, "locationInWindow")) { ret_point(e->x, e->y); *ret = 0; return 1; }
                  if (!strcmp(sel, "modifierFlags")) { *ret = 0; return 1; }
                  if (!strcmp(sel, "keyCode")) { *ret = (uint32_t)e->kc; return 1; }
                  if (!strcmp(sel, "clickCount")) { *ret = 1; return 1; }
                  if (!strcmp(sel, "buttonNumber")) { *ret = (e->type == 3 || e->type == 4) ? 1 : 0; return 1; }
                  if (!strcmp(sel, "window")) { *ret = g_window_obj; return 1; }
                  if (!strcmp(sel, "characters") || !strcmp(sel, "charactersIgnoringModifiers")) { char cb[2] = { (char)e->ch, 0 }; *ret = nsstr(cb); return 1; }
                  if (!strcmp(sel, "deltaX") || !strcmp(sel, "deltaY")) { SF(1, 0); *ret = 0; return 1; }
              }
              if (!strcmp(sel, "mouseLocationOutsideOfEventStream")) { ret_point(win_x(), win_y()); *ret = 0; return 1; }
              if (!strcmp(sel, "keyWindow") || !strcmp(sel, "mainWindow")) { *ret = g_window_obj; return 1; }
              if (!strcmp(sel, "currentEvent")) { *ret = g_cur_event; return 1; }
              if (!strcmp(sel, "frame") || !strcmp(sel, "bounds") || !strcmp(sel, "visibleFrame")) { ret_rect(0, 0, 800.0f, 600.0f); *ret = 0; return 1; }
              if (!strcmp(sel, "mainScreen")) { *ret = singleton("NSScreen"); return 1; }
              if (!strncmp(sel, "convertBaseToScreen:", 20) || !strncmp(sel, "convertScreenToBase:", 20) ||
                  !strncmp(sel, "convertPoint:", 13)) { ret_point((float)F(1), (float)F(2)); *ret = 0; return 1; }
              if (!strcmp(cn, "NSWindow") && !strncmp(sel, "initWithContentRect:", 20)) {
                  g_window_obj = self;
                  LOG("[input] jendela game = %08x\n", self);
                  *ret = self; return 1;
              }
              return 0;
          }
          static uint32_t sys_msg(const char *cn, int is_class, GClass *gc, uint32_t self, const char *sel, uint32_t *a)
          {
              char key[220];
              snprintf(key, sizeof key, "%c[%s %s]", is_class ? '+' : '-', cn, sel);
              if (seen_first(key)) LOG("    objc: %s\n", key);
              { uint32_t rv = 0; if (sys_msg_input(cn, self, sel, a, &rv)) return rv; }
              if (is_class) {
                  if (!strcmp(sel, "alloc") || !strcmp(sel, "allocWithZone:") || !strcmp(sel, "new"))
                      return gc ? new_obj_guest(gc) : new_obj_sys(cn);
                  if (!strcmp(sel, "sharedApplication")) return the_app(gc);
                  if (!strcmp(cn, "NSBundle") && !strcmp(sel, "mainBundle")) return singleton("NSBundle");
                  if (!strcmp(cn, "NSFileManager") && !strcmp(sel, "defaultManager")) return singleton("NSFileManager");
                  if (!strcmp(cn, "NSString") && (!strcmp(sel, "stringWithUTF8String:") || !strncmp(sel, "stringWithCString:", 18)))
                      return nsstr(cs(a[2]));
                  if (!strcmp(cn, "NSTimer") && !strncmp(sel, "scheduledTimerWithTimeInterval:target:selector:", 47)) {
                      g_timer_target = a[4];          /* double memakai slot r5:r6 */
                      g_timer_sel = a[5];
                      LOG("    NSTimer terdaftar: target=%08x selector=\"%s\"\n", a[4], cs(a[5]));
                      return new_obj_sys("NSTimer");
                  }
                  return 0;
              }
              if (!strncmp(sel, "init", 4) || !strcmp(sel, "retain") || !strcmp(sel, "autorelease") ||
                  !strcmp(sel, "self") || !strcmp(sel, "copy"))
                  return self;
              if (!strcmp(cn, "NSBundle")) {
                  char b[800];
                  if (!strcmp(sel, "resourcePath")) { snprintf(b, sizeof b, "%s/Contents/Resources", g_app_path); return nsstr(b); }
                  if (!strcmp(sel, "bundlePath")) return nsstr(g_app_path);
                  if (!strcmp(sel, "executablePath")) { snprintf(b, sizeof b, "%s/Contents/MacOS/Luxor", g_app_path); return nsstr(b); }
              }
              if (!strcmp(cn, "NSString")) {
                  if (!strcmp(sel, "cString") || !strcmp(sel, "UTF8String") || !strcmp(sel, "lossyCString") ||
                      !strcmp(sel, "fileSystemRepresentation"))
                      return rd32(self + 4);
                  if (!strcmp(sel, "length")) return (uint32_t)strlen(nsstr_c(self));
                  if (!strcmp(sel, "stringByAppendingString:") || !strcmp(sel, "stringByAppendingPathComponent:")) {
                      char b[1600];
                      snprintf(b, sizeof b, "%s%s%s", nsstr_c(self), sel[16] == 'P' ? "/" : "", nsstr_c(a[2]));
                      return nsstr(b);
                  }
                  if (!strcmp(sel, "isEqualToString:")) return strcmp(nsstr_c(self), nsstr_c(a[2])) == 0;
                  if (!strcmp(sel, "capitalizedString") || !strcmp(sel, "uppercaseString") || !strcmp(sel, "lowercaseString")) {
                      const char *src = nsstr_c(self); char b[256]; size_t n = strlen(src); if (n > 255) n = 255;
                      int start = 1;
                      for (size_t i = 0; i < n; i++) {
                          unsigned char c = (unsigned char)src[i];
                          if (sel[0] == 'u') c = (unsigned char)toupper(c);
                          else if (sel[0] == 'l') c = (unsigned char)tolower(c);
                          else { c = start ? (unsigned char)toupper(c) : (unsigned char)tolower(c); start = !isalnum(c); }
                          b[i] = (char)c;
                      }
                      b[n] = 0;
                      return nsstr(b);
                  }
                  if (!strcmp(sel, "characterAtIndex:")) { const char *src = nsstr_c(self); return a[2] < strlen(src) ? (uint32_t)(unsigned char)src[a[2]] : 0; }
              }
              if (!strcmp(cn, "NSFileManager")) {
                  if (!strcmp(sel, "changeCurrentDirectoryPath:")) {
                      int r = chdir(nsstr_c(a[2]));
                      LOG("    chdir(\"%s\") -> %d\n", nsstr_c(a[2]), r);
                      return r == 0;
                  }
                  if (!strcmp(sel, "currentDirectoryPath")) { char b[800]; if (!getcwd(b, sizeof b)) b[0] = 0; return nsstr(b); }
              }
              return 0;
          }

          static uint32_t do_msg(uint32_t self, uint32_t sel, uint32_t *a)
          {
              const char *selname = cs(sel);
              Recv r = classify(self);
              if (!r.valid) {
                  if (self) {
                      char k[64];
                      snprintf(k, sizeof k, "?recv %08x", self);
                      if (seen_first(k)) LOG("    objc: penerima tak dikenal %08x sel=%s (isa=%08x)\n", self, selname, rd32(self));
                  }
                  return 0;
              }
              if (!r.is_class) {
                  for (GClass *g = r.gc; g; g = find_gclass(g->super)) {
                      uint32_t imp = find_imp(g->cls, selname);
                      if (imp) { g_tail = imp; return 0; }
                  }
              }
              const char *cn = r.name;
              for (GClass *g = r.gc; g; g = find_gclass(g->super)) cn = g->super;   /* naik ke kelas sistem teratas */
              return sys_msg(cn, r.is_class, r.gc, self, selname, a);
          }


          static int cmp_calls(const void *x, const void *y)
          {
              const Hle *p = &g_hle[*(const int *)x], *q = &g_hle[*(const int *)y];
              return (p->calls < q->calls) - (p->calls > q->calls);
          }
          static void print_call_stats(void)
          {
              int idx[1024], n = 0;
              for (int i = 0; i < g_nhle && n < 1024; i++) if (g_hle[i].calls) idx[n++] = i;
              qsort(idx, n, sizeof(int), cmp_calls);
              LOG("\nheap guest terpakai: %u KB dari %u KB\n", (unsigned)((g_heap_ptr - HEAP_BASE) / 1024), (unsigned)(HEAP_SIZE / 1024));
              LOG("\n== Statistik panggilan HLE (terbanyak) ==\n");
              for (int i = 0; i < n && i < 80; i++)
                  LOG("  %8llu  %s%s\n", (unsigned long long)g_hle[idx[i]].calls, g_hle[idx[i]].name, g_hle[idx[i]].known ? "" : "  [generik]");
          }

          /* ===================== I/O file berbasis FILE* host ===================== */
          static FILE *g_fp[64];
          static uint32_t g_fpaddr[64];
          static int g_nfopen;
          static uint32_t file_new(FILE *f)
          {
              for (int i = 3; i < 64; i++)
                  if (!g_fp[i]) {
                      g_fp[i] = f;
                      if (!g_fpaddr[i]) g_fpaddr[i] = data_alloc(96);   /* sebesar struct __sFILE macOS (88 byte) */
                      uint8_t *p = g2h(g_fpaddr[i], 96);
                      if (p) { memset(p, 0, 96); wbe32(p, (uint32_t)i); p[15] = (uint8_t)i; /* _file */ }
                      return g_fpaddr[i];
                  }
              fclose(f);
              return 0;
          }
          static FILE *file_get(uint32_t a)
          {
              for (int i = 3; i < 64; i++) if (g_fp[i] && g_fpaddr[i] == a) return g_fp[i];
              return NULL;
          }
          /* feof()/ferror() di macOS adalah MAKRO yang membaca FILE->_flags (offset 12) langsung,
           * tanpa memanggil fungsi.  Jadi flag EOF/ERR harus disalin ke struct palsu di guest,
           * kalau tidak loop "while(!feof(f)) fgets(...)" tidak pernah berhenti. */
          static void file_sync(uint32_t a, FILE *f)
          {
              uint8_t *p = g2h(a, 16);
              if (!p || !f) return;
              uint16_t fl = (uint16_t)((p[12] << 8) | p[13]);
              fl &= (uint16_t)~(0x20 | 0x40);
              if (feof(f)) fl |= 0x20;
              if (ferror(f)) fl |= 0x40;
              p[12] = (uint8_t)(fl >> 8); p[13] = (uint8_t)fl;
          }
          static void file_drop(uint32_t a)
          {
              for (int i = 3; i < 64; i++) if (g_fp[i] && g_fpaddr[i] == a) { fclose(g_fp[i]); g_fp[i] = NULL; }
          }

