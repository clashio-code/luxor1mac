          /* sscanf minimal: %d %i %u %x %c %s %f %lf %[..] dengan lebar opsional dan %* */
          static uint32_t scan_guest(const char *in, const char *fmt, VaCtx *c)
          {
              const char *s = in; uint32_t n = 0;
              for (const char *f = fmt; *f; f++) {
                  if (isspace((unsigned char)*f)) { while (isspace((unsigned char)*s)) s++; continue; }
                  if (*f != '%') { if (*s != *f) break; s++; continue; }
                  f++;
                  if (*f == '%') { if (*s != '%') break; s++; continue; }
                  int skip = 0, width = 0, lng = 0, half = 0;
                  if (*f == '*') { skip = 1; f++; }
                  while (isdigit((unsigned char)*f)) width = width * 10 + (*f++ - '0');
                  while (*f == 'l' || *f == 'h' || *f == 'L') { if (*f == 'h') half = 1; else lng++; f++; }
                  char cv = *f;
                  if (cv != 'c' && cv != '[') while (isspace((unsigned char)*s)) s++;
                  if (!*s && cv != 'n') break;
                  if (cv == 'd' || cv == 'i' || cv == 'u' || cv == 'x' || cv == 'X') {
                      char tmp[64]; int w = width ? width : 63; int k = 0;
                      while (s[k] && k < w && k < 63 && (isxdigit((unsigned char)s[k]) || strchr("+-xX", s[k]))) k++;
                      memcpy(tmp, s, (size_t)k); tmp[k] = 0;
                      char *e; long v = (cv == 'x' || cv == 'X') ? (long)strtoul(tmp, &e, 16) : (cv == 'i') ? strtol(tmp, &e, 0) : strtol(tmp, &e, 10);
                      if (e == tmp) break;
                      s += e - tmp;
                      if (!skip) { uint32_t pa = va_next(c); uint8_t *p = g2h(pa, 4);
                          if (p) { if (half) { p[0] = (uint8_t)(v >> 8); p[1] = (uint8_t)v; } else wbe32(p, (uint32_t)v); } n++; }
                  } else if (cv == 'f' || cv == 'e' || cv == 'g' || cv == 'E' || cv == 'G') {
                      char *e; double v = strtod(s, &e);
                      if (e == s) break;
                      s = e;
                      if (!skip) { uint32_t pa = va_next(c);
                          if (lng) { uint8_t *p = g2h(pa, 8); uint64_t u; memcpy(&u, &v, 8); if (p) { wbe32(p, (uint32_t)(u >> 32)); wbe32(p + 4, (uint32_t)u); } }
                          else { uint8_t *p = g2h(pa, 4); float fv = (float)v; uint32_t u; memcpy(&u, &fv, 4); if (p) wbe32(p, u); }
                          n++; }
                  } else if (cv == 's') {
                      int w = width ? width : 0x7fffffff; int k = 0;
                      while (s[k] && !isspace((unsigned char)s[k]) && k < w) k++;
                      if (!skip) { uint32_t pa = va_next(c); char *p = (char *)g2h(pa, (uint32_t)k + 1); if (p) { memcpy(p, s, (size_t)k); p[k] = 0; } n++; }
                      s += k;
                  } else if (cv == 'c') {
                      int w = width ? width : 1;
                      if ((int)strlen(s) < w) break;
                      if (!skip) { uint32_t pa = va_next(c); char *p = (char *)g2h(pa, (uint32_t)w); if (p) memcpy(p, s, (size_t)w); n++; }
                      s += w;
                  } else if (cv == '[') {
                      f++; int neg = 0; if (*f == '^') { neg = 1; f++; }
                      char set[128]; int sl = 0;
                      if (*f == ']') set[sl++] = *f++;
                      while (*f && *f != ']' && sl < 127) set[sl++] = *f++;
                      set[sl] = 0;
                      int w = width ? width : 0x7fffffff; int k = 0;
                      while (s[k] && k < w && ((strchr(set, s[k]) != NULL) != neg)) k++;
                      if (!k) break;
                      if (!skip) { uint32_t pa = va_next(c); char *p = (char *)g2h(pa, (uint32_t)k + 1); if (p) { memcpy(p, s, (size_t)k); p[k] = 0; } n++; }
                      s += k;
                      if (!*f) break;
                  } else if (cv == 'n') {
                      if (!skip) { uint32_t pa = va_next(c); uint8_t *p = g2h(pa, 4); if (p) wbe32(p, (uint32_t)(s - in)); }
                  } else break;
              }
              return n;
          }
