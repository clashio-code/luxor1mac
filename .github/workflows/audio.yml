          static uint32_t stack_arg(int k) { uint8_t *p = g2h(R(1) + 24 + 4 * (uint32_t)k, 4); return p ? be32(p) : 0; }
          static void mv_mul(const float *n)
          {
              float *m = g_mv, r[6];
              r[0] = m[0] * n[0] + m[2] * n[1];
              r[1] = m[1] * n[0] + m[3] * n[1];
              r[2] = m[0] * n[2] + m[2] * n[3];
              r[3] = m[1] * n[2] + m[3] * n[3];
              r[4] = m[0] * n[4] + m[2] * n[5] + m[4];
              r[5] = m[1] * n[4] + m[3] * n[5] + m[5];
              memcpy(m, r, sizeof r);
          }

          static uint32_t conv_px(const uint8_t *p, uint32_t fmt, uint32_t type, int *ok)
          {
              *ok = 1;
              if (fmt == 0x80E1 && (type == 0x8367 || type == 0x8035 + 0x332)) return be32(p);              /* BGRA + 8888_REV (BE: A R G B) */
              if (fmt == 0x80E1 && type == 0x1401) return ((uint32_t)p[3] << 24) | ((uint32_t)p[2] << 16) | ((uint32_t)p[1] << 8) | p[0];
              if (fmt == 0x80E1 && type == 0x8035) return ((uint32_t)p[3] << 24) | ((uint32_t)p[2] << 16) | ((uint32_t)p[1] << 8) | p[0];
              if (fmt == 0x1908 && (type == 0x1401 || type == 0x8035))
                  return ((uint32_t)p[3] << 24) | ((uint32_t)p[0] << 16) | ((uint32_t)p[1] << 8) | p[2];
              if (fmt == 0x1908 && type == 0x8367) return ((uint32_t)p[0] << 24) | ((uint32_t)p[3] << 16) | ((uint32_t)p[2] << 8) | p[1];
              if (fmt == 0x1907 && type == 0x1401) return 0xff000000u | ((uint32_t)p[0] << 16) | ((uint32_t)p[1] << 8) | p[2];
              if (fmt == 0x80E0 && type == 0x1401) return 0xff000000u | ((uint32_t)p[2] << 16) | ((uint32_t)p[1] << 8) | p[0];
              if (fmt == 0x1906 && type == 0x1401) return ((uint32_t)p[0] << 24) | 0xffffffu;
              if (fmt == 0x1909 && type == 0x1401) return 0xff000000u | ((uint32_t)p[0] * 0x010101u);
              if (fmt == 0x190A && type == 0x1401) return ((uint32_t)p[1] << 24) | ((uint32_t)p[0] * 0x010101u);
              if (fmt == 0x80E1 && type == 0x8366) { uint16_t v = be16(p);                                 /* 1555_REV: A1 R5 G5 B5 */
                  uint32_t r = (v >> 10) & 31, g = (v >> 5) & 31, b = v & 31;
                  return ((v & 0x8000) ? 0xff000000u : 0) | ((r * 255 / 31) << 16) | ((g * 255 / 31) << 8) | (b * 255 / 31); }
              if (fmt == 0x80E1 && type == 0x8365) { uint16_t v = be16(p);                                 /* 4444_REV: A4 R4 G4 B4 */
                  return (((v >> 12) & 15) * 17u << 24) | (((v >> 8) & 15) * 17u << 16) | (((v >> 4) & 15) * 17u << 8) | ((v & 15) * 17u); }
              *ok = 0;
              return 0xffff00ffu;
          }
          static int px_size(uint32_t fmt, uint32_t type)
          {
              if (type == 0x8367 || type == 0x8035) return 4;
              if (type == 0x8366 || type == 0x8365 || type == 0x8033 || type == 0x8034) return 2;
              switch (fmt) { case 0x1907: case 0x80E0: return 3; case 0x1906: case 0x1909: return 1; case 0x190A: return 2; default: return 4; }
          }
          static void tex_upload(uint32_t target, int xo, int yo, int w, int h, uint32_t fmt, uint32_t type, uint32_t pix, int full)
          {
              uint32_t id = (target == 0x84F5) ? g_boundrect : g_bound2d;
              if (!id || id >= GTEX_MAX || w <= 0 || h <= 0 || w > 4096 || h > 4096) return;
              GTex *t = &g_tex[id];
              if (full) {
                  if (t->w != w || t->h != h || !t->px) { free(t->px); t->px = (uint32_t *)calloc((size_t)w * h, 4); t->w = w; t->h = h; }
                  if (!t->px) { t->w = t->h = 0; return; }
              }
              if (!t->px) return;
              if (g_gl_logn < 40) {
                  g_gl_logn++;
                  LOG("[gl] %s tex=%u target=%04x %dx%d @%d,%d fmt=%04x type=%04x pix=%08x rowlen=%d\n",
                      full ? "TexImage2D" : "TexSubImage2D", id, target, w, h, xo, yo, fmt, type, pix, g_unpack_row);
              }
              if (!pix) return;
              int ps = px_size(fmt, type);
              int row = g_unpack_row > 0 ? g_unpack_row : w;
              const uint8_t *src = g2h(pix, (uint32_t)(row * ps) * (uint32_t)(h - 1) + (uint32_t)(w * ps));
              if (!src) { LOG("[gl] piksel tekstur di luar memori guest (%08x)\n", pix); return; }
              static int warned;
              for (int y = 0; y < h; y++) {
                  int ty = yo + y; if (ty < 0 || ty >= t->h) continue;
                  const uint8_t *s = src + (size_t)y * row * ps;
                  for (int x = 0; x < w; x++) {
                      int tx = xo + x; if (tx < 0 || tx >= t->w) continue;
                      int ok; t->px[(size_t)ty * t->w + tx] = conv_px(s + (size_t)x * ps, fmt, type, &ok);
                      if (!ok && !warned) { warned = 1; LOG("[gl] FORMAT PIKSEL BELUM DIDUKUNG fmt=%04x type=%04x (diisi magenta)\n", fmt, type); }
                  }
              }
          }

          static float bfac(uint32_t f, const float *s, const float *d, int ch)
          {
              switch (f) {
              case 0: return 0; case 1: return 1;
              case 0x300: return s[ch]; case 0x301: return 1 - s[ch];
              case 0x302: return s[3]; case 0x303: return 1 - s[3];
              case 0x304: return d[3]; case 0x305: return 1 - d[3];
              case 0x306: return d[ch]; case 0x307: return 1 - d[ch];
              default: return 1;
              }
          }
          static void raster_tri(const GV *A, const GV *B, const GV *C, GTex *tx, int rect)
          {
              float area = (B->x - A->x) * (C->y - A->y) - (B->y - A->y) * (C->x - A->x);
              if (fabsf(area) < 1e-6f) return;
              float mnx = fminf(A->x, fminf(B->x, C->x)), mxx = fmaxf(A->x, fmaxf(B->x, C->x));
              float mny = fminf(A->y, fminf(B->y, C->y)), mxy = fmaxf(A->y, fmaxf(B->y, C->y));
              int x0 = (int)floorf(mnx), x1 = (int)ceilf(mxx), y0 = (int)floorf(mny), y1 = (int)ceilf(mxy);
              if (x0 < 0) x0 = 0;
              if (y0 < 0) y0 = 0;
              if (x1 > g_scr_w) x1 = g_scr_w;
              if (y1 > g_scr_h) y1 = g_scr_h;
              float ia = 1.0f / area;
              for (int y = y0; y < y1; y++) {
                  float py = y + 0.5f;
                  for (int x = x0; x < x1; x++) {
                      float px = x + 0.5f;
                      float w0 = ((B->x - px) * (C->y - py) - (B->y - py) * (C->x - px)) * ia;
                      float w1 = ((C->x - px) * (A->y - py) - (C->y - py) * (A->x - px)) * ia;
                      float w2 = 1.0f - w0 - w1;
                      if (w0 < -1e-5f || w1 < -1e-5f || w2 < -1e-5f) continue;
                      float s[4];
                      for (int k = 0; k < 4; k++) s[k] = w0 * A->c[k] + w1 * B->c[k] + w2 * C->c[k];
                      if (tx && tx->px) {
                          float u = w0 * A->u + w1 * B->u + w2 * C->u, v = w0 * A->v + w1 * B->v + w2 * C->v;
                          int iu = rect ? (int)u : (int)(u * tx->w), iv = rect ? (int)v : (int)(v * tx->h);
                          if (iu < 0) iu = 0;
                          if (iu >= tx->w) iu = tx->w - 1;
                          if (iv < 0) iv = 0;
                          if (iv >= tx->h) iv = tx->h - 1;
                          uint32_t t = tx->px[(size_t)iv * tx->w + iu];
                          s[0] *= ((t >> 16) & 255) / 255.0f; s[1] *= ((t >> 8) & 255) / 255.0f;
                          s[2] *= (t & 255) / 255.0f;        s[3] *= (t >> 24) / 255.0f;
                      }
                      uint32_t *dp = &g_fb[(size_t)y * g_scr_w + x];
                      float o[4];
                      if (g_en_blend) {
                          float d[4] = { ((*dp >> 16) & 255) / 255.0f, ((*dp >> 8) & 255) / 255.0f, (*dp & 255) / 255.0f, (*dp >> 24) / 255.0f };
                          for (int k = 0; k < 4; k++) o[k] = s[k] * bfac(g_bsrc, s, d, k) + d[k] * bfac(g_bdst, s, d, k);
                      } else memcpy(o, s, sizeof o);
                      uint32_t r = 0;
                      for (int k = 0; k < 4; k++) { float f = o[k] < 0 ? 0 : o[k] > 1 ? 1 : o[k]; r |= (uint32_t)(f * 255.0f + 0.5f) << (k == 3 ? 24 : 16 - 8 * k); }
                      *dp = r;
                  }
              }
          }
          /* jalur cepat: quad sejajar sumbu (hampir semua sprite 2D Luxor) digambar dengan aritmetika integer */
          static int fast_quad(GTex *tx, int rect)
          {
              if (g_nvb != 4 || (g_prim != 5 && g_prim != 7 && g_prim != 6 && g_prim != 9)) return 0;
              GV *v = g_vb;
              float mnx = v[0].x, mxx = v[0].x, mny = v[0].y, mxy = v[0].y;
              for (int i = 1; i < 4; i++) { mnx = fminf(mnx, v[i].x); mxx = fmaxf(mxx, v[i].x); mny = fminf(mny, v[i].y); mxy = fmaxf(mxy, v[i].y); }
              if (mxx - mnx < 0.5f || mxy - mny < 0.5f) return 1;
              float u0 = 0, u1 = 0, v0 = 0, v1 = 0; int gu0 = 0, gu1 = 0, gv0 = 0, gv1 = 0;
              for (int i = 0; i < 4; i++) {
                  int ax = fabsf(v[i].x - mnx) < 0.01f ? 0 : fabsf(v[i].x - mxx) < 0.01f ? 1 : -1;
                  int ay = fabsf(v[i].y - mny) < 0.01f ? 0 : fabsf(v[i].y - mxy) < 0.01f ? 1 : -1;
                  if (ax < 0 || ay < 0) return 0;                                   /* terputar / miring */
                  if (ax == 0) { if (gu0 && u0 != v[i].u) return 0; u0 = v[i].u; gu0 = 1; } else { if (gu1 && u1 != v[i].u) return 0; u1 = v[i].u; gu1 = 1; }
                  if (ay == 0) { if (gv0 && v0 != v[i].v) return 0; v0 = v[i].v; gv0 = 1; } else { if (gv1 && v1 != v[i].v) return 0; v1 = v[i].v; gv1 = 1; }
                  for (int k = 0; k < 4; k++) if (v[i].c[k] != v[0].c[k]) return 0;  /* warna harus seragam */
              }
              if (!gu0 || !gu1 || !gv0 || !gv1) return 0;
              int blend = g_en_blend;
              if (blend && !(g_bsrc == 0x302 && g_bdst == 0x303) && !(g_bsrc == 1 && g_bdst == 0) && !(g_bsrc == 0x302 && g_bdst == 1) && !(g_bsrc == 1 && g_bdst == 0x303)) return 0;
              int x0 = (int)floorf(mnx + 0.5f), x1 = (int)floorf(mxx + 0.5f), y0 = (int)floorf(mny + 0.5f), y1 = (int)floorf(mxy + 0.5f);
              float W = mxx - mnx, Hh = mxy - mny;
              int tw = tx && tx->px ? tx->w : 1, th = tx && tx->px ? tx->h : 1;
              double su = rect ? 1.0 : tw, sv = rect ? 1.0 : th;
              /* u(x) = u0 + (x + 0.5 - mnx) * (u1-u0)/W, dalam fixed point 16.16 texel */
              int64_t du = (int64_t)(((u1 - u0) / W) * su * 65536.0), dv = (int64_t)(((v1 - v0) / Hh) * sv * 65536.0);
              int64_t ub = (int64_t)((u0 * su + (x0 + 0.5 - mnx) * ((u1 - u0) / W) * su) * 65536.0);
              int64_t vb = (int64_t)((v0 * sv + (y0 + 0.5 - mny) * ((v1 - v0) / Hh) * sv) * 65536.0);
              if (x0 < 0) { ub += du * (int64_t)(-x0); x0 = 0; }
              if (y0 < 0) { vb += dv * (int64_t)(-y0); y0 = 0; }
              if (x1 > g_scr_w) x1 = g_scr_w;
              if (y1 > g_scr_h) y1 = g_scr_h;
              int cr = (int)(v[0].c[0] * 255 + 0.5f), cg = (int)(v[0].c[1] * 255 + 0.5f), cb = (int)(v[0].c[2] * 255 + 0.5f), ca = (int)(v[0].c[3] * 255 + 0.5f);
              int white = cr == 255 && cg == 255 && cb == 255 && ca == 255;
              for (int y = y0; y < y1; y++, vb += dv) {
                  int iv = (int)(vb >> 16); if (iv < 0) iv = 0; if (iv >= th) iv = th - 1;
                  const uint32_t *trow = (tx && tx->px) ? tx->px + (size_t)iv * tw : NULL;
                  uint32_t *d = g_fb + (size_t)y * g_scr_w;
                  int64_t u = ub;
                  for (int x = x0; x < x1; x++, u += du) {
                      uint32_t s;
                      if (trow) { int iu = (int)(u >> 16); if (iu < 0) iu = 0; if (iu >= tw) iu = tw - 1; s = trow[iu]; }
                      else s = 0xffffffffu;
                      uint32_t sa = s >> 24, sr = (s >> 16) & 255, sg = (s >> 8) & 255, sb = s & 255;
                      if (!white) { sr = sr * cr / 255; sg = sg * cg / 255; sb = sb * cb / 255; sa = sa * ca / 255; }
                      if (!blend || (g_bsrc == 1 && g_bdst == 0)) { d[x] = (sa << 24) | (sr << 16) | (sg << 8) | sb; continue; }
                      uint32_t p = d[x], dr = (p >> 16) & 255, dg = (p >> 8) & 255, db = p & 255;
                      uint32_t fs = (g_bsrc == 1) ? 255 : sa, fd = (g_bdst == 1) ? 255 : 255 - sa;
                      if (fs == 0 && fd == 255) continue;
                      uint32_t r = (sr * fs + dr * fd) / 255, g = (sg * fs + dg * fd) / 255, b = (sb * fs + db * fd) / 255;
                      if (r > 255) r = 255;
                      if (g > 255) g = 255;
                      if (b > 255) b = 255;
                      d[x] = 0xff000000u | (r << 16) | (g << 8) | b;
                  }
              }
              return 1;
          }
          /* jalur cepat kedua: quad jajaran genjang (sprite diputar/diskalakan, mis. bola & partikel demo).
           * Pemetaan layar -> tekstur affine, dihitung inkremental per piksel. */
          static int affine_quad(GTex *tx, int rect)
          {
              if (g_nvb != 4 || (g_prim != 5 && g_prim != 7 && g_prim != 6 && g_prim != 9)) return 0;
              GV *v = g_vb;
              for (int i = 1; i < 4; i++) for (int k = 0; k < 4; k++) if (v[i].c[k] != v[0].c[k]) return 0;
              int blend = g_en_blend;
              if (blend && !(g_bsrc == 0x302 && g_bdst == 0x303) && !(g_bsrc == 1 && g_bdst == 0) && !(g_bsrc == 0x302 && g_bdst == 1) && !(g_bsrc == 1 && g_bdst == 0x303)) return 0;
              /* urutan sudut: strip = 0,1,3,2 ; quad/fan = 0,1,2,3 */
              const GV *P0 = &v[0], *P1 = &v[1], *P2, *P3;
              if (g_prim == 5) { P2 = &v[3]; P3 = &v[2]; } else { P2 = &v[2]; P3 = &v[3]; }
              /* harus jajaran genjang: P0+P2 == P1+P3 (posisi & uv) */
              if (fabsf(P0->x + P2->x - P1->x - P3->x) > 0.05f || fabsf(P0->y + P2->y - P1->y - P3->y) > 0.05f) return 0;
              if (fabsf(P0->u + P2->u - P1->u - P3->u) > 1e-4f || fabsf(P0->v + P2->v - P1->v - P3->v) > 1e-4f) return 0;
              float ax = P1->x - P0->x, ay = P1->y - P0->y, bx = P3->x - P0->x, by = P3->y - P0->y;
              float det = ax * by - ay * bx;
              if (fabsf(det) < 1e-3f) return 1;
              /* s,t in [0,1]: titik = P0 + s*a + t*b */
              float ia = by / det, ib = -bx / det, ic = -ay / det, id = ax / det;
              int tw = tx && tx->px ? tx->w : 1, th = tx && tx->px ? tx->h : 1;
              float su = rect ? 1.0f : (float)tw, sv = rect ? 1.0f : (float)th;
              float du_s = (P1->u - P0->u) * su, du_t = (P3->u - P0->u) * su, dv_s = (P1->v - P0->v) * sv, dv_t = (P3->v - P0->v) * sv;
              float mnx = fminf(fminf(P0->x, P1->x), fminf(P2->x, P3->x)), mxx = fmaxf(fmaxf(P0->x, P1->x), fmaxf(P2->x, P3->x));
              float mny = fminf(fminf(P0->y, P1->y), fminf(P2->y, P3->y)), mxy = fmaxf(fmaxf(P0->y, P1->y), fmaxf(P2->y, P3->y));
              int x0 = (int)floorf(mnx), x1 = (int)ceilf(mxx), y0 = (int)floorf(mny), y1 = (int)ceilf(mxy);
              if (x0 < 0) x0 = 0;
              if (y0 < 0) y0 = 0;
              if (x1 > g_scr_w) x1 = g_scr_w;
              if (y1 > g_scr_h) y1 = g_scr_h;
              if (x0 >= x1 || y0 >= y1) return 1;
              int cr = (int)(v[0].c[0] * 255 + 0.5f), cg = (int)(v[0].c[1] * 255 + 0.5f), cb = (int)(v[0].c[2] * 255 + 0.5f), ca = (int)(v[0].c[3] * 255 + 0.5f);
              int white = cr == 255 && cg == 255 && cb == 255 && ca == 255;
              for (int y = y0; y < y1; y++) {
                  float py = y + 0.5f - P0->y, px = x0 + 0.5f - P0->x;
                  float s = ia * px + ib * py, t = ic * px + id * py;
                  uint32_t *d = g_fb + (size_t)y * g_scr_w;
                  for (int x = x0; x < x1; x++, s += ia, t += ic) {
                      if (s < 0 || s >= 1 || t < 0 || t >= 1) continue;
                      uint32_t sp = 0xffffffffu;
                      if (tx && tx->px) {
                          int iu = (int)(P0->u * su + s * du_s + t * du_t), iv = (int)(P0->v * sv + s * dv_s + t * dv_t);
                          if (iu < 0) iu = 0;
                          if (iu >= tw) iu = tw - 1;
                          if (iv < 0) iv = 0;
                          if (iv >= th) iv = th - 1;
                          sp = tx->px[(size_t)iv * tw + iu];
                      }
                      uint32_t sa = sp >> 24, sr = (sp >> 16) & 255, sg = (sp >> 8) & 255, sb = sp & 255;
                      if (!white) { sr = sr * cr / 255; sg = sg * cg / 255; sb = sb * cb / 255; sa = sa * ca / 255; }
                      if (!blend || (g_bsrc == 1 && g_bdst == 0)) { d[x] = (sa << 24) | (sr << 16) | (sg << 8) | sb; continue; }
                      uint32_t p = d[x], dr = (p >> 16) & 255, dg = (p >> 8) & 255, db = p & 255;
                      uint32_t fs = (g_bsrc == 1) ? 255 : sa, fd = (g_bdst == 1) ? 255 : 255 - sa;
                      if (fs == 0 && fd == 255) continue;
                      uint32_t r = (sr * fs + dr * fd) / 255, g = (sg * fs + dg * fd) / 255, b = (sb * fs + db * fd) / 255;
                      if (r > 255) r = 255;
                      if (g > 255) g = 255;
                      if (b > 255) b = 255;
                      d[x] = 0xff000000u | (r << 16) | (g << 8) | b;
                  }
              }
              return 1;
          }
          static void gl_flush_prim(void)
          {
              fb_ensure();
              if (!g_fb) return;
              GTex *tx = NULL; int rect = 0;
              if (g_en_texrect && g_boundrect && g_boundrect < GTEX_MAX) { tx = &g_tex[g_boundrect]; rect = 1; }
              else if (g_en_tex2d && g_bound2d && g_bound2d < GTEX_MAX) tx = &g_tex[g_bound2d];
              int n = g_nvb;
              double rt0 = mono_s();
              if (fast_quad(tx, rect)) { g_n_fast++; g_t_render += mono_s() - rt0; return; }
              if (affine_quad(tx, rect)) { g_n_affine++; g_t_render += mono_s() - rt0; return; }
              g_n_slow++;
              switch (g_prim) {
              case 4: for (int i = 0; i + 2 < n; i += 3) raster_tri(&g_vb[i], &g_vb[i + 1], &g_vb[i + 2], tx, rect); break;      /* TRIANGLES */
              case 5: for (int i = 0; i + 2 < n; i++) raster_tri(&g_vb[i], &g_vb[i + 1], &g_vb[i + 2], tx, rect); break;         /* TRIANGLE_STRIP */
              case 6: case 9: for (int i = 1; i + 1 < n; i++) raster_tri(&g_vb[0], &g_vb[i], &g_vb[i + 1], tx, rect); break;    /* FAN / POLYGON */
              case 7: for (int i = 0; i + 3 < n; i += 4) { raster_tri(&g_vb[i], &g_vb[i + 1], &g_vb[i + 2], tx, rect);           /* QUADS */
                                                           raster_tri(&g_vb[i], &g_vb[i + 2], &g_vb[i + 3], tx, rect); } break;
              default: break;   /* titik / garis diabaikan dulu */
              }
              g_t_render += mono_s() - rt0;
          }
          static void gl_vertex(float x, float y)
          {
              if (g_nvb >= 512) return;
              float wx = g_mv[0] * x + g_mv[2] * y + g_mv[4], wy = g_mv[1] * x + g_mv[3] * y + g_mv[5];
              double l = g_ortho[0], r = g_ortho[1], b = g_ortho[2], t = g_ortho[3];
              GV *v = &g_vb[g_nvb++];
              v->x = (float)((wx - l) / (r - l) * g_scr_w);
              v->y = (float)((t - wy) / (t - b) * g_scr_h);
              v->u = g_tc[0]; v->v = g_tc[1];
              memcpy(v->c, g_col, sizeof v->c);
          }
          static void save_bmp(const char *path)
          {
              if (!g_fb) return;
              FILE *f = fopen(path, "wb");
              if (!f) { LOG("[gl] gagal menulis %s (%s)\n", path, strerror(errno)); return; }
              int W = g_scr_w, Hh = g_scr_h, rs = (W * 3 + 3) & ~3;
              uint32_t sz = 54 + (uint32_t)rs * Hh;
              uint8_t h[54] = { 'B', 'M' };
              h[2] = sz; h[3] = sz >> 8; h[4] = sz >> 16; h[5] = sz >> 24; h[10] = 54; h[14] = 40;
              h[18] = W; h[19] = W >> 8; h[22] = Hh; h[23] = Hh >> 8; h[26] = 1; h[28] = 24;
              fwrite(h, 1, 54, f);
              uint8_t *row = (uint8_t *)calloc(1, (size_t)rs);
              for (int y = Hh - 1; y >= 0; y--) {
                  for (int x = 0; x < W; x++) { uint32_t p = g_fb[(size_t)y * W + x]; row[x * 3] = p; row[x * 3 + 1] = p >> 8; row[x * 3 + 2] = p >> 16; }
                  fwrite(row, 1, (size_t)rs, f);
              }
              free(row); fclose(f);
              LOG("[gl] screenshot: %s\n", path);
          }

          /* ===================== M4: tampilkan framebuffer software ke layar (/dev/fb0) ===================== */
          #include <fcntl.h>
          #include <sys/ioctl.h>
          #include <linux/fb.h>
          static int g_fbdev = -1, g_use_fb = 1;
          static uint8_t *g_fbmem;
          static struct fb_var_screeninfo g_vi;
          static struct fb_fix_screeninfo g_fi;
          static int *g_mapx, *g_mapy, g_dw, g_dh, g_dx, g_dy;
          static double g_last_present;

          static void fbdev_open(void)
          {
              if (!g_use_fb || g_fbdev >= 0) return;
              const char *dev = getenv("LUXOR_FBDEV"); if (!dev || !*dev) dev = "/dev/fb0";
              g_fbdev = open(dev, O_RDWR);
              if (g_fbdev < 0) { LOG("[fb] buka %s gagal: %s\n", dev, strerror(errno)); g_use_fb = 0; return; }
              if (ioctl(g_fbdev, FBIOGET_VSCREENINFO, &g_vi) || ioctl(g_fbdev, FBIOGET_FSCREENINFO, &g_fi)) {
                  LOG("[fb] ioctl info gagal: %s\n", strerror(errno)); close(g_fbdev); g_fbdev = -1; g_use_fb = 0; return;
              }
              LOG("[fb] %s: %ux%u virt %ux%u off %u,%u bpp=%u line=%u smem=%u  R%u/%u G%u/%u B%u/%u A%u/%u\n", dev,
                  g_vi.xres, g_vi.yres, g_vi.xres_virtual, g_vi.yres_virtual, g_vi.xoffset, g_vi.yoffset,
                  g_vi.bits_per_pixel, g_fi.line_length, g_fi.smem_len,
                  g_vi.red.offset, g_vi.red.length, g_vi.green.offset, g_vi.green.length,
                  g_vi.blue.offset, g_vi.blue.length, g_vi.transp.offset, g_vi.transp.length);
              if (g_vi.bits_per_pixel != 32 && g_vi.bits_per_pixel != 16) { LOG("[fb] bpp %u belum didukung\n", g_vi.bits_per_pixel); g_use_fb = 0; return; }
              g_fbmem = (uint8_t *)mmap(NULL, g_fi.smem_len, PROT_READ | PROT_WRITE, MAP_SHARED, g_fbdev, 0);
              if (g_fbmem == MAP_FAILED) { g_fbmem = NULL; LOG("[fb] mmap gagal: %s\n", strerror(errno)); g_use_fb = 0; return; }
              g_fb_w0 = (int)g_vi.xres; g_fb_h0 = (int)g_vi.yres;
              ioctl(g_fbdev, FBIOBLANK, FB_BLANK_UNBLANK);
              { int t = open("/sys/class/graphics/fbcon/cursor_blink", O_WRONLY); if (t >= 0) { if (write(t, "0", 1) < 0) {} close(t); } }
              { int t = open("/dev/tty1", O_WRONLY); if (t >= 0) { const char *e = "\033[?25l\033[2J"; if (write(t, e, strlen(e)) < 0) {} close(t); } }
              LOG("[fb] layar siap\n");
          }

          static void fbdev_present(void)
          {
              if (!g_fb) return;
              fbdev_open();
              if (!g_fbmem) return;
              int W = (int)g_vi.xres, Hh = (int)g_vi.yres;
              if (!g_mapx || g_dw == 0) {
                  /* skala dengan rasio tetap (letterbox), 800x600 -> 640x480 pas 0.8 */
                  double sx = (double)W / g_scr_w, sy = (double)Hh / g_scr_h, s = sx < sy ? sx : sy;
                  g_dw = (int)(g_scr_w * s); g_dh = (int)(g_scr_h * s);
                  g_dx = (W - g_dw) / 2; g_dy = (Hh - g_dh) / 2;
                  free(g_mapx); free(g_mapy);
                  g_mapx = (int *)malloc(sizeof(int) * g_dw); g_mapy = (int *)malloc(sizeof(int) * g_dh);
                  for (int x = 0; x < g_dw; x++) g_mapx[x] = (int)((x + 0.5) * g_scr_w / g_dw);
                  for (int y = 0; y < g_dh; y++) g_mapy[y] = (int)((y + 0.5) * g_scr_h / g_dh);
                  LOG("[fb] skala %dx%d -> %dx%d di %d,%d\n", g_scr_w, g_scr_h, g_dw, g_dh, g_dx, g_dy);
                  for (int y = 0; y < Hh; y++) memset(g_fbmem + (size_t)(y + g_vi.yoffset) * g_fi.line_length, 0, g_fi.line_length);
              }
              uint32_t yo = g_vi.yoffset, xo = g_vi.xoffset;
              int bpp = (int)g_vi.bits_per_pixel;
              if (bpp == 32 && g_dw == g_scr_w && g_dh == g_scr_h && g_vi.red.offset == 16 && g_vi.blue.offset == 0) {
                  for (int y = 0; y < g_dh; y++)
                      memcpy((uint32_t *)(g_fbmem + (size_t)(y + g_dy + yo) * g_fi.line_length) + g_dx + xo, g_fb + (size_t)y * g_scr_w, (size_t)g_scr_w * 4);
                  goto presented;
              }
              for (int y = 0; y < g_dh; y++) {
                  const uint32_t *src = g_fb + (size_t)g_mapy[y] * g_scr_w;
                  uint8_t *row = g_fbmem + (size_t)(y + g_dy + yo) * g_fi.line_length;
                  if (bpp == 32) {
                      uint32_t *d = (uint32_t *)row + g_dx + xo;
                      if (g_vi.red.offset == 16 && g_vi.blue.offset == 0) {
                          for (int x = 0; x < g_dw; x++) d[x] = src[g_mapx[x]] | 0xff000000u;
                      } else {
                          for (int x = 0; x < g_dw; x++) {
                              uint32_t p = src[g_mapx[x]];
                              d[x] = (((p >> 16) & 255) << g_vi.red.offset) | (((p >> 8) & 255) << g_vi.green.offset) |
                                     ((p & 255) << g_vi.blue.offset) | (g_vi.transp.length ? (255u << g_vi.transp.offset) : 0);
                          }
                      }
                  } else {
                      uint16_t *d = (uint16_t *)row + g_dx + xo;
                      for (int x = 0; x < g_dw; x++) {
                          uint32_t p = src[g_mapx[x]];
                          d[x] = (uint16_t)(((p >> 8) & 0xf800) | ((p >> 5) & 0x07e0) | ((p >> 3) & 0x001f));
                      }
                  }
              }
          presented:
              ioctl(g_fbdev, FBIOPAN_DISPLAY, &g_vi);
              g_last_present = mono_s();
          }

          /* ===================== tombol keluar (SELECT+START / MENU) + batas waktu =====================
           * Thread terpisah membaca /dev/input/event*, jadi tetap jalan walau emulator macet di dalam game. */
          #include <pthread.h>
          #include <dirent.h>
          #include <linux/input.h>
          static void fbdev_clear_exit(void)
          {
              if (g_fbmem) for (uint32_t y = 0; y < g_vi.yres_virtual && (size_t)(y + 1) * g_fi.line_length <= g_fi.smem_len; y++)
                  memset(g_fbmem + (size_t)y * g_fi.line_length, 0, g_fi.line_length);
              int t = open("/dev/tty1", O_WRONLY); if (t >= 0) { const char *e = "\033[?25h"; if (write(t, e, strlen(e)) < 0) {} close(t); }
          }
          static void quit_now(const char *why)
          {
              LOG("\n== KELUAR: %s ==\n", why);
              if (g_logf) fflush(g_logf);
              fbdev_clear_exit();
              _exit(0);
          }
          static volatile int g_in_thr = -1;          /* tid thread guest yang sedang jalan, -1 = loop utama */
          static volatile unsigned g_slices;
          static void ram_info(char *o, size_t n)
          {
              long rss_kb = -1, avail_kb = -1;
              FILE *f = fopen("/proc/self/statm", "r");
              if (f) { long sz, rs; if (fscanf(f, "%ld %ld", &sz, &rs) == 2) rss_kb = rs * (sysconf(_SC_PAGESIZE) / 1024); fclose(f); }
              f = fopen("/proc/meminfo", "r");
              if (f) { char l[128]; while (fgets(l, sizeof l, f)) if (!strncmp(l, "MemAvailable:", 13)) { avail_kb = atol(l + 13); break; } fclose(f); }
              snprintf(o, n, "RAM proses=%ldMB bebas=%ldMB heap-game=%uMB/%uMB", rss_kb / 1024, avail_kb / 1024,
                       (unsigned)((g_heap_ptr - HEAP_BASE) >> 20), (unsigned)(HEAP_SIZE >> 20));
          }
          /* ===== kursor overlay: digerakkan & digambar oleh thread input (~60 Hz), lepas dari fps game ===== */
          static pthread_mutex_t g_fbmtx = PTHREAD_MUTEX_INITIALIZER;
          static int g_ov_x = -10000, g_ov_y = -10000;
          static const char *g_cur_shape[] = {
              "X           ", "XX          ", "X.X         ", "X..X        ", "X...X       ", "X....X      ",
              "X.....X     ", "X......X    ", "X.......X   ", "X........X  ", "X.....XXXXX ", "X..X..X     ",
              "X.X X..X    ", "XX  X..X    ", "X    X..X   ", "     X..X   ", "      XX    ", NULL };
          static void fb_put(int x, int y, uint32_t p)
          {
              if (x < 0 || y < 0 || x >= (int)g_vi.xres || y >= (int)g_vi.yres) return;
              uint8_t *row = g_fbmem + (size_t)(y + g_vi.yoffset) * g_fi.line_length;
              if (g_vi.bits_per_pixel == 32) {
                  uint32_t v = (((p >> 16) & 255) << g_vi.red.offset) | (((p >> 8) & 255) << g_vi.green.offset) | ((p & 255) << g_vi.blue.offset) |
                               (g_vi.transp.length ? (255u << g_vi.transp.offset) : 0);
                  ((uint32_t *)row)[x + g_vi.xoffset] = v;
              } else ((uint16_t *)row)[x + g_vi.xoffset] = (uint16_t)(((p >> 8) & 0xf800) | ((p >> 5) & 0x07e0) | ((p >> 3) & 0x001f));
          }
          static void ov_restore_locked(void)
          {
              if (g_ov_x < -1000 || !g_fb || !g_mapx) return;
              for (int y = 0; y < 17; y++) for (int x = 0; x < 12; x++) {
                  int px = g_ov_x + x, py = g_ov_y + y, lx = px - g_dx, ly = py - g_dy;
                  uint32_t c = 0xff000000u;
                  if (lx >= 0 && ly >= 0 && lx < g_dw && ly < g_dh) c = g_fb[(size_t)g_mapy[ly] * g_scr_w + g_mapx[lx]];
                  fb_put(px, py, c);
              }
              g_ov_x = -10000;
          }
          static void ov_draw_locked(void)
          {
              if (!g_fbmem || !g_dw || !g_cur_show) return;
              int sx = g_dx + (int)(g_cur_x * g_dw / 800.0), sy = g_dy + (int)(g_cur_y * g_dh / 600.0);
              for (int y = 0; g_cur_shape[y]; y++) for (int x = 0; g_cur_shape[y][x]; x++) {
                  char c = g_cur_shape[y][x]; if (c == ' ') continue;
                  fb_put(sx + x, sy + y, c == 'X' ? 0xff000000u : 0xffffffffu);
              }
              g_ov_x = sx; g_ov_y = sy;
          }
          static void cursor_overlay_update(void)
          {
              if (!g_fbmem || !g_dw) return;
              pthread_mutex_lock(&g_fbmtx);
              int sx = g_dx + (int)(g_cur_x * g_dw / 800.0), sy = g_dy + (int)(g_cur_y * g_dh / 600.0);
              if (sx != g_ov_x || sy != g_ov_y) { ov_restore_locked(); ov_draw_locked(); }
              pthread_mutex_unlock(&g_fbmtx);
          }
          /* gerak kursor: tekan singkat = 1 langkah kecil, tahan = makin cepat (akselerasi) */
          static void cursor_move_tick(double dt, double *hold_t, int *pdx, int *pdy)
          {
              int dx = g_pad_dx, dy = g_pad_dy;
              double sx = g_stick_x / 1000.0, sy = g_stick_y / 1000.0;
              int active = dx || dy || sx != 0 || sy != 0;
              if (!active) { *hold_t = 0; *pdx = *pdy = 0; return; }
              if (*hold_t == 0) {                                  /* awal tekan: langsung geser 2 piksel game */
                  g_cur_x += dx * 2; g_cur_y += dy * 2;
              }
              *hold_t += dt;
              double base = g_btn_slow ? 60.0 : 120.0, top = g_btn_slow ? 200.0 : 700.0;
              double sp = *hold_t < 0.15 ? 0 : base + (top - base) * fmin(1.0, (*hold_t - 0.15) / 0.8);
              if (sx != 0 || sy != 0) sp = g_btn_slow ? 200.0 : 600.0;
              g_cur_x += (dx + sx) * sp * dt;
              g_cur_y += (dy + sy) * sp * dt;
              if (g_cur_x < 0) g_cur_x = 0;
              if (g_cur_x > 799) g_cur_x = 799;
              if (g_cur_y < 0) g_cur_y = 0;
              if (g_cur_y > 599) g_cur_y = 599;
              *pdx = dx; *pdy = dy;
          }
          static unsigned long g_hle_fetch_calls;
          static unsigned long g_aud_blocks, g_aud_under;
          static double g_aud_t_mix;
          static volatile int g_prof_report_req;
          static volatile unsigned long g_hle_calls_total, g_fcmp_total;
          static volatile unsigned long g_fpemu_total;
          static unsigned long g_fpemu_calls_all(void) { return g_fpemu_total; }
          /* laporan berkala: fungsi tiruan (HLE) yang paling sering dipanggil sejak laporan terakhir */
          static uint64_t *g_hle_prev;
          static void hle_top_report(void)
          {
              if (!g_hle_prev) g_hle_prev = (uint64_t *)calloc((size_t)g_caphle + 64, sizeof(uint64_t));
              if (!g_hle_prev) return;
              int best[8]; uint64_t bv[8]; int nb = 0;
              for (int i = 0; i < g_nhle && i < g_caphle + 64; i++) {
                  uint64_t d = g_hle[i].calls - g_hle_prev[i];
                  g_hle_prev[i] = g_hle[i].calls;
                  if (!d) continue;
                  int p = nb < 8 ? nb++ : 7;
                  if (p == 7 && nb == 8 && d <= bv[7]) continue;
                  best[p] = i; bv[p] = d;
                  while (p > 0 && bv[p] > bv[p - 1]) { int ti = best[p]; best[p] = best[p - 1]; best[p - 1] = ti; uint64_t tv = bv[p]; bv[p] = bv[p - 1]; bv[p - 1] = tv; p--; }
              }
              char b[600]; int n = 0;
              for (int i = 0; i < nb && n < 560; i++) n += snprintf(b + n, sizeof b - n, " %s=%llu", g_hle[best[i]].name, (unsigned long long)bv[i]);
              LOG("[perf]   HLE terbanyak (30 dtk):%s\n", b);
          }
          static char g_inname[16][64];
          static const char *nm_of(int *fds, int i) { (void)fds; return g_inname[i]; }
          static void *input_thread(void *ud)
          {
              (void)ud;
              int fds[16], nfd = 0;
              DIR *dir = opendir("/dev/input");
              if (dir) {
                  struct dirent *e;
                  while ((e = readdir(dir)) && nfd < 16) {
                      if (strncmp(e->d_name, "event", 5)) continue;
                      char p[300]; snprintf(p, sizeof p, "/dev/input/%s", e->d_name);
                      int fd = open(p, O_RDONLY | O_NONBLOCK);
                      if (fd < 0) continue;
                      char nm[128] = "?"; ioctl(fd, EVIOCGNAME(sizeof nm), nm);
                      LOG("[input] %s = \"%s\"\n", p, nm);
                      snprintf(g_inname[nfd], sizeof g_inname[0], "%s", e->d_name);
                      for (int ax = 0; ax < 64; ax++) {
                          struct input_absinfo ai;
                          if (ioctl(fd, EVIOCGABS(ax), &ai) == 0 && ai.maximum > ai.minimum && !g_absok[ax]) {
                              g_absmin[ax] = ai.minimum; g_absmax[ax] = ai.maximum; g_absok[ax] = 1;
                              LOG("[input]   abs %d: %d..%d\n", ax, ai.minimum, ai.maximum);
                          }
                      }
                      fds[nfd++] = fd;
                  }
                  closedir(dir);
              }
              int sel = 0, start = 0, menu = 0, logged = 0;
              /* muOS (RG40XX dkk.): SELECT=310, START=311 menurut log device; standar Linux 314/315 juga diterima.
               * Bisa diganti: LUXOR_KEY_SELECT / LUXOR_KEY_START */
              unsigned k_sel1 = 310, k_sel2 = BTN_SELECT, k_st1 = 311, k_st2 = BTN_START;
              if (getenv("LUXOR_KEY_SELECT")) k_sel1 = (unsigned)atoi(getenv("LUXOR_KEY_SELECT"));
              if (getenv("LUXOR_KEY_START"))  k_st1  = (unsigned)atoi(getenv("LUXOR_KEY_START"));
              LOG("[input] keluar = kode %u/%u + %u/%u bersamaan\n", k_sel1, k_sel2, k_st1, k_st2);
              double t0 = mono_s(), menu_t = 0, hb_t = mono_s();
              const char *to = getenv("LUXOR_TIMEOUT");
              double limit = to ? atof(to) : 0;
              for (;;) {
                  for (int i = 0; i < nfd; i++) {
                      struct input_event ev;
                      while (read(fds[i], &ev, sizeof ev) == (ssize_t)sizeof ev) {
                          if (ev.type == EV_ABS) {
                              int ax = ev.code, v = ev.value;
                              if (ax == ABS_HAT0X) g_pad_dx = v < 0 ? -1 : v > 0 ? 1 : 0;
                              else if (ax == ABS_HAT0Y) g_pad_dy = v < 0 ? -1 : v > 0 ? 1 : 0;
                              else if (ax < 64 && g_absok[ax] && (ax == ABS_X || ax == ABS_Y || ax == ABS_RX || ax == ABS_RY)) {
                                  int mid = (g_absmin[ax] + g_absmax[ax]) / 2, half = (g_absmax[ax] - g_absmin[ax]) / 2;
                                  int n = half ? (int)((long)(v - mid) * 1000 / half) : 0;
                                  if (n > -150 && n < 150) n = 0;                       /* deadzone */
                                  if (ax == ABS_X || ax == ABS_RX) g_stick_x = n; else g_stick_y = n;
                              }
                              static int absl; if (absl < 20 && (ax == ABS_HAT0X || ax == ABS_HAT0Y)) { absl++; LOG("[input] abs kode=%d nilai=%d\n", ax, v); }
                              continue;
                          }
                          if (ev.type != EV_KEY) continue;
                          {
                              int dn = ev.value != 0;
                              switch (ev.code) {
                              case BTN_DPAD_UP: case KEY_UP:       g_pad_dy = dn ? -1 : (g_pad_dy == -1 ? 0 : g_pad_dy); break;
                              case BTN_DPAD_DOWN: case KEY_DOWN:   g_pad_dy = dn ?  1 : (g_pad_dy ==  1 ? 0 : g_pad_dy); break;
                              case BTN_DPAD_LEFT: case KEY_LEFT:   g_pad_dx = dn ? -1 : (g_pad_dx == -1 ? 0 : g_pad_dx); break;
                              case BTN_DPAD_RIGHT: case KEY_RIGHT: g_pad_dx = dn ?  1 : (g_pad_dx ==  1 ? 0 : g_pad_dx); break;
                              case 304: g_btn_l = dn; break;      /* A (muOS) */
                              case 305: g_btn_r = dn; break;      /* B (muOS) */
                              case 308: g_btn_slow = dn; break;   /* L1 = kursor pelan */
                              case 306: if (dn) g_key_req = 1; break;   /* tombol kode 306 = ketik nama + Enter */
                              case 307: if (dn) g_key_req = 2; break;   /* tombol kode 307 = Backspace */
                              case 309: if (dn) g_key_req = 3; break;   /* R1 = Enter */
                              default: break;
                              }
                          }
                          if (ev.value != 2 && logged < 200) { logged++; LOG("[input] %s kode=%u nilai=%d\n", nm_of(fds, i), ev.code, ev.value); }
                          int dn = ev.value != 0;
                          if (ev.code == k_sel1 || ev.code == k_sel2 || ev.code == KEY_BACKSPACE || ev.code == KEY_RIGHTSHIFT) sel = dn;
                          if (ev.code == k_st1 || ev.code == k_st2 || ev.code == KEY_ENTER) start = dn;
                          if (ev.code == BTN_MODE || ev.code == KEY_HOMEPAGE || ev.code == KEY_MENU) { menu = dn; if (dn) menu_t = mono_s(); }
                          if (ev.code == KEY_ESC && dn) quit_now("tombol ESC");
                      }
                  }
                  if (mono_s() - hb_t > 5.0) {
                      hb_t = mono_s();
                      unsigned bp = g_blkpos;
                      char rb[160]; ram_info(rb, sizeof rb);
                      {
                          static int lf; static double lr, lp, lt; static unsigned lfa, laf, lsl;
                          double dtv = hb_t - lt; int df = g_curframe - lf;
                          if (lt > 0 && dtv > 0)
                              LOG("[perf] %.1f fps | render %.0f%% | ke-layar %.0f%% | emulasi+lain %.0f%% | sprite cepat=%u putar=%u lambat=%u\n",
                                  df / dtv, 100 * (g_t_render - lr) / dtv, 100 * (g_t_present - lp) / dtv,
                                  100 - 100 * (g_t_render - lr + g_t_present - lp) / dtv, g_n_fast - lfa, g_n_affine - laf, g_n_slow - lsl);
                          { static double lam; static unsigned long lun; if (g_aud_blocks) LOG("[perf]   audio: %lu blok, putus %lu kali (5 dtk), mixing %.0f%% waktu\n", g_aud_blocks, g_aud_under - lun, 100 * (g_aud_t_mix - lam) / dtv); lam = g_aud_t_mix; lun = g_aud_under; }
                          { static unsigned long lhc, lfc; LOG("[perf]   HLE: %.0f/detik | fcmpu: %.0f/detik\n", (g_hle_calls_total - lhc) / dtv, (g_fcmp_total - lfc) / dtv); lhc = g_hle_calls_total; lfc = g_fcmp_total; }
                          { static int rep; if (++rep % 6 == 0) { hle_top_report(); g_prof_report_req = 1; } }
                          { static double lo; static unsigned long lfe; { double sp = 100.0 * (dtv - (g_time_off - lo)) / dtv; if (sp < 0) sp = 0; LOG("[perf]   kecepatan game: %.0f%% dari normal | FPU ditangani loader: %lu/detik\n", sp, (unsigned long)((g_fpemu_calls_all() - lfe) / dtv)); lfe = g_fpemu_calls_all(); } lo = g_time_off; }
                          lf = g_curframe; lr = g_t_render; lp = g_t_present; lt = hb_t; lfa = g_n_fast; laf = g_n_affine; lsl = g_n_slow;
                      }
                      LOG("[hb] t=%.0fs frame=%d jalan=%s slice=%u HLE=%s blok=%s | %s\n", hb_t - t0, g_curframe,
                          g_in_thr < 0 ? "utama" : "thread", g_slices, g_lasthle ? g_lasthle : "-",
                          describe(g_lastblk[(bp - 1) & 63]), rb);
                  }
                  if (sel && start) quit_now("SELECT+START");
                  if (menu && mono_s() - menu_t > 1.0) quit_now("MENU ditahan 1 detik");
                  if (limit > 0 && mono_s() - t0 > limit) quit_now("batas waktu LUXOR_TIMEOUT");
                  {   /* gerak + gambar kursor ~60 Hz, tidak menunggu frame game */
                      static double lt, hold; static int pdx, pdy;
                      double nw = mono_s(), dtc = lt ? nw - lt : 0.016; if (dtc > 0.05) dtc = 0.05; lt = nw;
                      cursor_move_tick(dtc, &hold, &pdx, &pdy);
                      cursor_overlay_update();
                  }
                  usleep(16000);
              }
              return NULL;
          }
          static void start_input_thread(void)
          {
              pthread_t th;
              if (pthread_create(&th, NULL, input_thread, NULL) == 0) pthread_detach(th);
              else LOG("[input] gagal membuat thread input\n");
          }
          static void sig_quit(int s) { (void)s; quit_now("sinyal TERM/INT"); }

          /* pthread_create: belum ada thread guest sungguhan.  Thread dicatat, lalu dijalankan sampai selesai
           * di antara frame (lihat stage2).  Cukup untuk thread "loading" Luxor (gameMenuState::_update_init). */
          typedef struct { uint32_t fn, arg, tid; int done, started; uint32_t sp; void *ctx; double used;
                           uint32_t gpr[32], pc, lr, ctr, xer, cr, msr; uint64_t fpr[32]; } GThread;
          static GThread g_thr[32];
          static int g_nthr;
          H(h_pthread_create) {
              uint32_t tid = 0x7000 + (uint32_t)g_nthr;
              if (g_nthr < 32) { g_thr[g_nthr].fn = a[2]; g_thr[g_nthr].arg = a[3]; g_thr[g_nthr].tid = tid; g_thr[g_nthr].done = 0; g_nthr++; }
              uint8_t *p = g2h(a[0], 4); if (p) wbe32(p, tid);
              LOG("[thread] pthread_create fn=%s arg=%08x -> tid %x (dijalankan setelah frame ini)\n", describe(a[2]), a[3], tid);
              return 0;
          }
          H(h_pthread_join) { uint8_t *p = g2h(a[1], 4); if (p) wbe32(p, 0); return 0; }
          H(h_pthread_self) { UNUSED; return 0x6fff; }

          /* qsort: emulator tidak bisa dipanggil bersarang dari dalam hook, jadi komparator guest yang dikenal
           * diterjemahkan ke host.  Vorbis (FMOD) memakai sort32a: array pointer ke uint32, urut naik. */
          static uint32_t g_qs_base;
          static int qs_deref_u32(const void *x, const void *y)
          {
              uint32_t a = rd32(be32((const uint8_t *)x)), b = rd32(be32((const uint8_t *)y));
              return (a > b) - (a < b);
          }
          static int qs_u32(const void *x, const void *y)
          {
              uint32_t a = be32((const uint8_t *)x), b = be32((const uint8_t *)y);
              return (a > b) - (a < b);
          }
          static int qs_s32(const void *x, const void *y)
          {
              int32_t a = (int32_t)be32((const uint8_t *)x), b = (int32_t)be32((const uint8_t *)y);
              return (a > b) - (a < b);
          }
          /* Vorbis floor1 icomp: return **(int **)a - **(int **)b  (array pointer ke int, urut naik bertanda) */
          static int qs_deref_s32(const void *x, const void *y)
          {
              int32_t a = (int32_t)rd32(be32((const uint8_t *)x)), b = (int32_t)rd32(be32((const uint8_t *)y));
              return (a > b) - (a < b);
          }
          H(h_qsort) {
              uint32_t n = a[1], sz = a[2];
              const char *cmp = describe(a[3]);
              uint8_t *p = g2h(a[0], n * sz);
              if (!p || n < 2) return 0;
              g_qs_base = a[0];
              int (*f)(const void *, const void *) = NULL;
              if (sz == 4 && strstr(cmp, "sort32a")) f = qs_deref_u32;
              else if (sz == 4 && strstr(cmp, "icomp")) f = qs_deref_s32;
              else if (sz == 4 && strstr(cmp, "int_compare")) f = qs_s32;
              char k[200]; snprintf(k, sizeof k, "qsort %s", cmp);
              if (seen_first(k)) LOG("[qsort] n=%u size=%u cmp=%s -> %s\n", n, sz, cmp, f ? "ditiru di host" : "TIDAK DIKENAL (urut uint32 naik sebagai tebakan)");
              if (!f) { if (sz != 4) return 0; f = qs_u32; }
              qsort(p, n, sz, f);
              return 0;
          }

          static void cursor_draw(void);
