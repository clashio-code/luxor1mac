          /* strtok: state disimpan sebagai alamat guest */
          static uint32_t g_strtok_save;
          static uint32_t strtok_guest(uint32_t s, uint32_t dl, uint32_t *save)
          {
              const char *delim = cs(dl);
              if (!s) s = *save;
              if (!s) return 0;
              char *p = (char *)g2h(s, 1);
              if (!p) { *save = 0; return 0; }
              size_t skip = strspn(p, delim);
              s += (uint32_t)skip; p += skip;
              if (!*p) { *save = 0; return 0; }
              size_t len = strcspn(p, delim);
              if (p[len]) { p[len] = 0; *save = s + (uint32_t)len + 1; }
              else *save = 0;
              return s;
          }
