          static int g_fb_w0, g_fb_h0;          /* ukuran layar fisik bila tersedia */
          static void fb_ensure(void)
          {
              if (!g_fb) {
                  if (g_native_res) {
                      fbdev_open();
                      if (g_fb_w0 > 0 && g_fb_h0 > 0) { g_scr_w = g_fb_w0; g_scr_h = g_fb_h0; }
                  }
