          /* MSR: FP (bit 13) | VEC (bit 25); FE0/FE1 (bit 11/8) = 0 -> exception FP tidak dikirim.
           * Dipanggil ulang sebelum SETIAP run_guest: Unicorn bisa mereset MSR saat
           * exception/rfi, dan instruksi FP saat MSR.FP=0 membuat Unicorn abort() (SIGNAL 6). */
          static int g_msr_logged;
          static void enable_fpu_altivec(void)
          {
              uint32_t msr = 0;
              uc_reg_read(g_uc, UC_PPC_REG_MSR, &msr);
              uint32_t want = (msr | (1u << 13) | (1u << 25)) & ~((1u << 11) | (1u << 8));
              if (want != msr) uc_reg_write(g_uc, UC_PPC_REG_MSR, &want);
          #ifdef LUXOR_HAVE_FPSCR
              if (!g_msr_logged) { uint32_t z = 0; uc_reg_write(g_uc, UC_PPC_REG_FPSCR, &z); }
          #endif
              if (!g_msr_logged) {
                  uint32_t back = 0;
                  uc_reg_read(g_uc, UC_PPC_REG_MSR, &back);
                  LOG("MSR: awal=%08x tulis=%08x baca-ulang=%08x  FP=%s VEC=%s\n", msr, want, back,
                      (back & (1u << 13)) ? "ON" : "OFF!!", (back & (1u << 25)) ? "ON" : "OFF");
                  g_msr_logged = 1;
              }
          }

          /* exception CPU guest (FP unavailable, program, alignment, dll) dicatat, bukan diam-diam abort */
          static unsigned long g_hle_sc_calls;
          static int g_hle_sc_mode = 0;     /* 1 = fungsi tiruan dipanggil lewat instruksi sc (tanpa hook kode); 0 = hook lama */
          static void hook_intr(uc_engine *uc, uint32_t intno, void *ud)
          {
              (void)uc; (void)ud;
              static int n;
              uint32_t pc = RPC();
              /* cadangan HLE: hook kode di slot trap terlewat -> instruksi 'sc' di slot tereksekusi */
              {
                  uint32_t sp = 0;
                  if (pc >= TRAP_BASE && pc < TRAP_BASE + TRAP_SIZE && rd32(pc) == 0x44000002u) sp = pc;
                  else if (pc - 4 >= TRAP_BASE && pc - 4 < TRAP_BASE + TRAP_SIZE && rd32(pc - 4) == 0x44000002u) sp = pc - 4;
                  if (sp) {
                      if (!g_hle_sc_mode && g_hle_sc_calls < 5) LOG("[hle] hook terlewat di %08x (%s) -> dipanggil lewat sc\n", sp, describe(sp));
                      g_hle_sc_calls++;
                      hook_code(g_uc, sp, 4, NULL);
                      return;
                  }
              }
              if (n++ < 20)
                  LOG("!! exception guest intno=%u di %s (insn %08x)  HLE terakhir=%s\n",
                      intno, describe(pc), rd32(pc), g_lasthle ? g_lasthle : "-");
              g_stop_reason = "exception CPU guest";
              g_stop = 3;
              uc_emu_stop(g_uc);
          }

          /* ===== diagnosa + pengaman uiGameLevel::fixDValue(int &path, int &node, float &d) =====
           * Fungsi ini mengulang "d -= jarak(node)" selama d >= jarak.  Kalau d tak hingga / sangat besar,
           * pengurangan 100.0 tidak mengubah nilai float -> loop abadi.  Nilai d dicatat dan dijepit. */
          static int sym_find_any(const char *name, uint32_t *addr);
          static unsigned g_fixd_n, g_fixd_bad;
          static void hook_fixd(uc_engine *uc, uint64_t addr, uint32_t size, void *ud)
          {
              (void)uc; (void)addr; (void)size; (void)ud;
              uint32_t pp = R(4), pn = R(5), pd = R(6);
              uint8_t *q = g2h(pd, 4);
              if (!q) return;
              uint32_t u = be32(q); float d; memcpy(&d, &u, 4);
              int path = (int)rd32(pp), node = (int)rd32(pn);
              g_fixd_n++;
              int bad = !isfinite(d) || d > 1e6f || d < -1e6f;
              if (g_fixd_n <= 15 || (bad && g_fixd_bad < 30))
                  LOG("[fixD] #%u path=%d node=%d d=%g%s  dari %s\n", g_fixd_n, path, node, (double)d, bad ? "  <-- TIDAK WAJAR, dijepit ke 0" : "", describe(RLR()));
              if (bad) { g_fixd_bad++; float z = 0; memcpy(&u, &z, 4); wbe32(q, u); }
          }
          /* pantau loop kedua fixDValue (while d < 0: node--; d += jarak) di alamat sesudah bl getNextNodeDistance */
          static unsigned g_fixd_iter, g_fixd_cut;
          static uint32_t g_fixd_call;
          static void hook_fixd_loop2(uc_engine *uc, uint64_t addr, uint32_t size, void *ud)
          {
              (void)uc; (void)addr; (void)size; (void)ud;
              if (g_fixd_call != g_fixd_n) { g_fixd_call = g_fixd_n; g_fixd_iter = 0; }
              g_fixd_iter++;
              uint32_t pd = R(30), pn = R(31);
              uint8_t *q = g2h(pd, 4);
              if (!q) return;
              uint32_t u = be32(q); float d; memcpy(&d, &u, 4);
              double dist = F(1);
              uint32_t cr = 0;
          #ifdef LUXOR_HAVE_CR
              uc_reg_read(g_uc, UC_PPC_REG_CR, &cr);
          #endif
              static unsigned l2log;
              if (g_fixd_iter <= 4 && l2log < 12) {
                  l2log++;
                  LOG("[fixD]   loop2 it=%u node=%d d=%g jarak=%g cr=%08x konst@38a08=%08x\n", g_fixd_iter, (int)rd32(pn), (double)d, dist, cr, rd32(0x38a08));
              }
              if (g_fixd_iter > 2000) {                       /* pengaman: paksa keluar dari loop */
                  if (g_fixd_cut++ < 3) LOG("[fixD]   loop2 >2000 putaran (node=%d d=%g jarak=%g) -> dipaksa keluar\n", (int)rd32(pn), (double)d, dist);
                  float z = 0; memcpy(&u, &z, 4); wbe32(q, u);
                  SF(1, 0.0);
                  g_fixd_iter = 0;
              }
          }
          /* tepat setelah fcmpu cr7,f0,f13 (alamat fixDValue+0xa8): bandingkan hasil emulator dengan perhitungan host */
          static void hook_fixd_cmp(uc_engine *uc, uint64_t addr, uint32_t size, void *ud)
          {
              (void)uc; (void)addr; (void)size; (void)ud;
              static unsigned n;
              if (n >= 12) return;
              n++;
              double f0 = F(0), f13 = F(13);
              uint32_t cr = 0;
          #ifdef LUXOR_HAVE_CR
              uc_reg_read(g_uc, UC_PPC_REG_CR, &cr);
          #endif
              unsigned c7 = cr & 15;
              unsigned want = f0 < f13 ? 8 : f0 > f13 ? 4 : f0 == f13 ? 2 : 1;
              uint64_t r0, r13; memcpy(&r0, &f0, 8); memcpy(&r13, &f13, 8);
              LOG("[fixD]   fcmpu f0=%g (%016llx) f13=%g (%016llx) -> cr7=%x, seharusnya %x %s\n", f0, (unsigned long long)r0, f13,
                  (unsigned long long)r13, c7, want, c7 == want ? "OK" : "<-- SALAH");
          }
          /* catat argumen getNextNodeDistance(path, node) untuk beberapa panggilan pertama */
          static unsigned g_gnd_n;
          static void hook_gnd(uc_engine *uc, uint64_t addr, uint32_t size, void *ud)
          {
              (void)uc; (void)addr; (void)size; (void)ud;
              if (g_fixd_n >= 1 && g_gnd_n < 12) { g_gnd_n++; LOG("[fixD]   getNextNodeDistance(path=%d, node=%d) this=%08x paths=%08x\n", (int)R(4), (int)R(5), R(3), rd32(R(3) + 408)); }
          }
          /* ===== perbaikan bug Unicorn: fcmpu/fcmpo memberi hasil CR yang salah (mis. 84 vs 0 -> LT) =====
           * Setiap instruksi fcmpu/fcmpo di __text semua image di-hook; loader menghitung perbandingannya
           * sendiri, menulis field CR + FPSCR[FPCC], lalu melompati instruksi aslinya. */
          static unsigned g_fcmp_n, g_fcmp_fix;
          static void hook_fcmp(uc_engine *uc, uint64_t addr, uint32_t size, void *ud)
          {
              (void)uc; (void)size; (void)ud;
              uint32_t w = rd32((uint32_t)addr);
              int crf = (w >> 23) & 7, fa = (w >> 16) & 31, fb = (w >> 11) & 31;
              double a = F(fa), b = F(fb);
              uint32_t c = (isnan(a) || isnan(b)) ? 1 : a < b ? 8 : a > b ? 4 : 2;
              uint32_t cr = 0;
              uc_reg_read(g_uc, UC_PPC_REG_CR, &cr);
              int sh = 28 - 4 * crf;
              uint32_t old = (cr >> sh) & 15;
              cr = (cr & ~(15u << sh)) | (c << sh);
              uc_reg_write(g_uc, UC_PPC_REG_CR, &cr);
          #ifdef LUXOR_HAVE_FPSCR
              uint32_t fs = 0; uc_reg_read(g_uc, UC_PPC_REG_FPSCR, &fs);
              fs = (fs & ~0xF000u) | (c << 12);
              uc_reg_write(g_uc, UC_PPC_REG_FPSCR, &fs);
          #endif
              g_fcmp_n++; g_fcmp_total++;
              if (old != c && g_fcmp_fix++ < 5)
                  LOG("[fcmp] %s: f%d=%g f%d=%g cr%d emulator=%x -> benar=%x\n", describe((uint32_t)addr), fa, a, fb, b, crf, old, c);
              WPC((uint32_t)addr + 4);
          }
          /* ===== perbaikan fcmpu/fcmpo TANPA hook: instruksi diganti lompatan ke stub PPC kecil =====
           * Stub membandingkan dua double lewat pola bit (urutan IEEE diubah jadi urutan integer tak bertanda),
           * lalu memakai cmplw (yang benar di Unicorn) untuk mengisi field CR yang sama.  Register r3..r7 disimpan
           * di bawah red-zone stack.  NaN tidak ditangani khusus (sangat jarang di game). */
          #define PPC_STFD(fs, d, ra) ((54u << 26) | ((fs) << 21) | ((ra) << 16) | ((uint32_t)(d) & 0xffff))
          #define PPC_STW(rs, d, ra)  ((36u << 26) | ((rs) << 21) | ((ra) << 16) | ((uint32_t)(d) & 0xffff))
          #define PPC_LWZ(rd, d, ra)  ((32u << 26) | ((rd) << 21) | ((ra) << 16) | ((uint32_t)(d) & 0xffff))
          #define PPC_OR(ra, rs, rb)  ((31u << 26) | ((rs) << 21) | ((ra) << 16) | ((rb) << 11) | (444u << 1))
          #define PPC_XOR(ra, rs, rb) ((31u << 26) | ((rs) << 21) | ((ra) << 16) | ((rb) << 11) | (316u << 1))
          #define PPC_SLWI1(ra, rs)   ((21u << 26) | ((rs) << 21) | ((ra) << 16) | (1u << 11) | (0u << 6) | (30u << 1))
          #define PPC_SRAWI(ra, rs, sh) ((31u << 26) | ((rs) << 21) | ((ra) << 16) | ((sh) << 11) | (824u << 1))
          #define PPC_ORIS(ra, rs, ui) ((25u << 26) | ((rs) << 21) | ((ra) << 16) | ((ui) & 0xffff))
          #define PPC_CMPWI(cf, ra, si) ((11u << 26) | ((cf) << 23) | ((ra) << 16) | ((uint32_t)(si) & 0xffff))
          #define PPC_CMPLW(cf, ra, rb) ((31u << 26) | ((cf) << 23) | ((ra) << 16) | ((rb) << 11) | (32u << 1))
          #define PPC_BC(bo, bi, disp) ((16u << 26) | ((bo) << 21) | ((bi) << 16) | ((uint32_t)(disp) & 0xfffc))
          #define PPC_B(disp)          ((18u << 26) | ((uint32_t)(disp) & 0x3fffffc))
          static int build_fcmp_stub(uint32_t *c, uint32_t w, uint32_t stub, uint32_t back)
          {
              uint32_t cf = (w >> 23) & 7, fa = (w >> 16) & 31, fb = (w >> 11) & 31, eqbit = 4 * cf + 2;
              int n = 0;
              c[n++] = PPC_STFD(fa, -248, 1);
              c[n++] = PPC_STFD(fb, -256, 1);
              for (int r = 3; r <= 7; r++) c[n++] = PPC_STW(r, -260 - 4 * (r - 3), 1);
              c[n++] = PPC_LWZ(3, -248, 1); c[n++] = PPC_LWZ(4, -244, 1);
              c[n++] = PPC_LWZ(5, -256, 1); c[n++] = PPC_LWZ(6, -252, 1);
              c[n++] = PPC_OR(7, 3, 5); c[n++] = PPC_SLWI1(7, 7); c[n++] = PPC_OR(7, 7, 4); c[n++] = PPC_OR(7, 7, 6);
              c[n++] = PPC_CMPWI(cf, 7, 0);
              int beq_at = n; c[n++] = 0;                                     /* beq crf -> done (±0 == ±0) */
              c[n++] = PPC_SRAWI(7, 3, 31); c[n++] = PPC_XOR(4, 4, 7); c[n++] = PPC_ORIS(7, 7, 0x8000); c[n++] = PPC_XOR(3, 3, 7);
              c[n++] = PPC_SRAWI(7, 5, 31); c[n++] = PPC_XOR(6, 6, 7); c[n++] = PPC_ORIS(7, 7, 0x8000); c[n++] = PPC_XOR(5, 5, 7);
              c[n++] = PPC_CMPLW(cf, 3, 5);
              int bne_at = n; c[n++] = 0;                                     /* bne crf -> done */
              c[n++] = PPC_CMPLW(cf, 4, 6);
              int done = n;
              for (int r = 3; r <= 7; r++) c[n++] = PPC_LWZ(r, -260 - 4 * (r - 3), 1);
              c[n] = PPC_B((int32_t)(back - (stub + 4u * (uint32_t)n))); n++;
              c[beq_at] = PPC_BC(12, eqbit, 4 * (done - beq_at));
              c[bne_at] = PPC_BC(4, eqbit, 4 * (done - bne_at));
              return n;
          }
          static int g_fcmp_patched[32];
          static int install_fcmp_patch(void)
          {
              const char *e = getenv("LUXOR_FCMP_PATCH");
              if (e && !atoi(e)) return 0;
              unsigned total = 0;
              for (int i = 0; i < g_nimg; i++) {
                  Image *im = g_img[i];
                  uint32_t sbase = im->is_exe ? 0x00e00000u : ((im->lo & ~(FW_STRIDE - 1)) + FW_STRIDE - 0x100000u);
                  if (im->hi > sbase || g2h(sbase, 1) || g2h(sbase + 0xfffff, 1)) { LOG("[fcmp] %s: tidak ada ruang stub, pakai hook\n", im->short_name); continue; }
                  int mapped = 0;
                  uint32_t sp = sbase;
                  for (int s = 0; s < im->nsects; s++) {
                      Sect *t = &im->sects[s];
                      if (strcmp(t->name, "__text")) continue;
                      uint32_t base = t->addr + im->slide;
                      for (uint32_t o = 0; o + 4 <= t->size; o += 4) {
                          uint32_t a = base + o, w = rd32(a);
                          if ((w >> 26) != 63 || (w & 0x600001u)) continue;
                          uint32_t xo = (w >> 1) & 0x3ff;
                          if (xo != 0 && xo != 32) continue;
                          if (!mapped) { map_region("fcmp-stub", sbase, 0x100000); mapped = 1; }
                          uint32_t code[48];
                          int n = build_fcmp_stub(code, w, sp, a + 4);
                          if (sp + 4u * (uint32_t)n > sbase + 0x100000u) break;
                          uint8_t *p = g2h(sp, 4u * (uint32_t)n);
                          for (int k = 0; k < n; k++) wbe32(p + 4 * k, code[k]);
                          wbe32(g2h(a, 4), PPC_B((int32_t)(sp - a)));
                          sp += ((uint32_t)n * 4 + 15) & ~15u;
                          total++;
                      }
                  }
                  g_fcmp_patched[i] = 1;
              }
              LOG("[fcmp] %u instruksi fcmpu/fcmpo ditambal langsung (tanpa hook)\n", total);
              return 1;
          }
          static void install_fcmp_fix(void)
          {
              const char *e = getenv("LUXOR_FCMP_FIX");
              if (e && atoi(e) == 0) { LOG("[fcmp] perbaikan dimatikan (LUXOR_FCMP_FIX=0)\n"); return; }
              install_fcmp_patch();
              unsigned total = 0;
              for (int i = 0; i < g_nimg; i++) {
                  Image *im = g_img[i];
                  if (g_fcmp_patched[i]) continue;
                  for (int s = 0; s < im->nsects; s++) {
                      Sect *t = &im->sects[s];
                      if (strcmp(t->name, "__text")) continue;
                      uint32_t base = t->addr + im->slide;
                      for (uint32_t o = 0; o + 4 <= t->size; o += 4) {
                          uint32_t w = rd32(base + o);
                          if ((w >> 26) != 63 || (w & 0x600001u)) continue;
                          uint32_t xo = (w >> 1) & 0x3ff;
                          if (xo != 0 && xo != 32) continue;
                          uc_hook h;
                          if (uc_hook_add(g_uc, &h, UC_HOOK_CODE, (void *)hook_fcmp, NULL, base + o, base + o) == UC_ERR_OK) total++;
                      }
                  }
              }
              LOG("[fcmp] %u instruksi fcmpu/fcmpo ditangani loader\n", total);
          }
          #if defined(LUXOR_HAVE_FPR)
          /* ===================== uji mandiri FPU Unicorn + perbaikan otomatis =====================
           * fcmpu terbukti salah di Unicorn. Di sini setiap instruksi floating-point dicoba sekali di emulator
           * dengan nilai uji, dibandingkan dengan hasil host.  Instruksi yang salah lalu ditangani loader
           * (di-hook per alamat di __text, dihitung di host) seperti perbaikan fcmpu. */
          static uint64_t Fbits(int i) { uint64_t v = 0; uc_reg_read(g_uc, UC_PPC_REG_FPR0 + i, &v); return v; }
          static void SFbits(int i, uint64_t v) { uc_reg_write(g_uc, UC_PPC_REG_FPR0 + i, &v); }
          static double bits2d(uint64_t b) { double d; memcpy(&d, &b, 8); return d; }
          static uint64_t d2bits(double d) { uint64_t b; memcpy(&b, &d, 8); return b; }
          static int fp_is_aform(uint32_t op, uint32_t xo5)
          {
              if (op == 59) return xo5 == 18 || xo5 == 20 || xo5 == 21 || xo5 == 22 || xo5 == 24 || xo5 == 25 || (xo5 >= 28 && xo5 <= 31);
              if (op == 63) return xo5 == 18 || xo5 == 20 || xo5 == 21 || xo5 == 22 || xo5 == 23 || xo5 == 25 || xo5 == 26 || (xo5 >= 28 && xo5 <= 31);
              return 0;
          }
          /* kunci jenis instruksi: op<<16 | xo (xo5 untuk A-form, xo10 untuk X-form) */
          static uint32_t fp_key(uint32_t w)
          {
              uint32_t op = w >> 26, xo5 = (w >> 1) & 31, xo10 = (w >> 1) & 0x3ff;
              if (op != 59 && op != 63) return 0;
              if (fp_is_aform(op, xo5)) return (op << 16) | xo5;
              if (op == 63 && (xo10 == 12 || xo10 == 14 || xo10 == 15 || xo10 == 40 || xo10 == 72 || xo10 == 136 || xo10 == 264)) return (op << 16) | 0x8000 | xo10;
              return 0;
          }
          /* hitung hasil instruksi di host; return 0 bila jenis tidak dikenal */
          static int fp_eval(uint32_t w, uint64_t *res)
          {
              uint32_t op = w >> 26, xo5 = (w >> 1) & 31, xo10 = (w >> 1) & 0x3ff;
              int ra = (w >> 16) & 31, rb = (w >> 11) & 31, rc = (w >> 6) & 31;
              double a = F(ra), b = F(rb), c = F(rc), r;
              if (fp_is_aform(op, xo5)) {
                  switch (xo5) {
                  case 18: r = a / b; break;
                  case 20: r = a - b; break;
                  case 21: r = a + b; break;
                  case 22: r = sqrt(b); break;
                  case 23: *res = (a >= 0.0) ? Fbits(rc) : Fbits(rb); return 1;      /* fsel */
                  case 24: r = 1.0 / b; break;
                  case 25: r = a * c; break;
                  case 26: r = 1.0 / sqrt(b); break;
                  case 28: r = fma(a, c, -b); break;
                  case 29: r = fma(a, c, b); break;
                  case 30: r = -fma(a, c, -b); break;
                  case 31: r = -fma(a, c, b); break;
                  default: return 0;
                  }
                  if (op == 59) r = (double)(float)r;
                  *res = d2bits(r);
                  return 1;
              }
              if (op != 63) return 0;
              uint64_t bb = Fbits(rb);
              switch (xo10) {
              case 12: *res = d2bits((double)(float)b); return 1;                      /* frsp */
              case 14: case 15: {                                                      /* fctiw / fctiwz */
                  double v = xo10 == 15 ? trunc(b) : nearbyint(b);
                  uint32_t iv = isnan(v) ? 0x80000000u : v > 2147483647.0 ? 0x7fffffffu : v < -2147483648.0 ? 0x80000000u : (uint32_t)(int32_t)v;
                  *res = 0xFFF8000000000000ull | iv; return 1;
              }
              case 40:  *res = bb ^ 0x8000000000000000ull; return 1;                  /* fneg */
              case 72:  *res = bb; return 1;                                           /* fmr */
              case 136: *res = bb | 0x8000000000000000ull; return 1;                  /* fnabs */
              case 264: *res = bb & ~0x8000000000000000ull; return 1;                 /* fabs */
              }
              return 0;
          }
          static uint32_t g_fp_bad[48];
          static int g_nfp_bad;
          static unsigned long g_fpemu_calls;
          static void hook_fpemu(uc_engine *uc, uint64_t addr, uint32_t size, void *ud)
          {
              (void)uc; (void)size; (void)ud;
              uint32_t w = rd32((uint32_t)addr);
              uint64_t r;
              if (!fp_eval(w, &r)) return;
              SFbits((w >> 21) & 31, r);
              g_fpemu_calls++; g_fpemu_total++;
              WPC((uint32_t)addr + 4);
          }
          static const char *fp_name(uint32_t k)
          {
              static char b[24];
              uint32_t op = k >> 16, x = k & 0x7fff;
              static const char *a63[32] = { [18]="fdiv",[20]="fsub",[21]="fadd",[22]="fsqrt",[23]="fsel",[25]="fmul",[26]="frsqrte",[28]="fmsub",[29]="fmadd",[30]="fnmsub",[31]="fnmadd" };
              static const char *a59[32] = { [18]="fdivs",[20]="fsubs",[21]="fadds",[22]="fsqrts",[24]="fres",[25]="fmuls",[28]="fmsubs",[29]="fmadds",[30]="fnmsubs",[31]="fnmadds" };
              if (k & 0x8000) {
                  switch (x) { case 12: return "frsp"; case 14: return "fctiw"; case 15: return "fctiwz"; case 40: return "fneg"; case 72: return "fmr"; case 136: return "fnabs"; case 264: return "fabs"; }
              } else if (x < 32) { const char *n = op == 59 ? a59[x] : a63[x]; if (n) return n; }
              snprintf(b, sizeof b, "op%u/%u", op, x);
              return b;
          }
          static void fpu_selftest_and_fix(void)
          {
              const char *e = getenv("LUXOR_FPFIX");
              int fix = !(e && atoi(e) == 0);
              static const double V[][3] = { {3.0, 1.5, 2.0}, {-0.75, 2.5, 4.0}, {0.001, 7.25, -3.5}, {100.25, -0.5, 0.125},
                                             {12345.678, 0.3, -1.0e-3}, {-2.0, 2.5, 0.5}, {0.0, -3.75, 9.0} };
              static const uint32_t A63[] = {18, 20, 21, 22, 23, 25, 26, 28, 29, 30, 31}, A59[] = {18, 20, 21, 22, 24, 25, 28, 29, 30, 31}, X63[] = {12, 14, 15, 40, 72, 136, 264};
              uint32_t keys[64]; uint32_t insns[64]; int nk = 0;
              for (size_t i = 0; i < sizeof A63 / 4; i++) { keys[nk] = (63u << 16) | A63[i]; insns[nk++] = (63u << 26) | (A63[i] << 1); }
              for (size_t i = 0; i < sizeof A59 / 4; i++) { keys[nk] = (59u << 16) | A59[i]; insns[nk++] = (59u << 26) | (A59[i] << 1); }
              for (size_t i = 0; i < sizeof X63 / 4; i++) { keys[nk] = (63u << 16) | 0x8000 | X63[i]; insns[nk++] = (63u << 26) | (4u << 21) | (2u << 11) | (X63[i] << 1); }
              uint32_t scratch = heap_alloc(64);
              LOG("== Uji mandiri FPU Unicorn ==\n");
              for (int k = 0; k < nk; k++) {
                  uint32_t w = insns[k];
                  if (!(keys[k] & 0x8000)) {
                      uint32_t x = keys[k] & 31;
                      int useA = !(x == 22 || x == 24 || x == 26), useB = (x != 25), useC = (x == 25 || x == 23 || x >= 28);
                      w |= 4u << 21;
                      if (useA) w |= 1u << 16;
                      if (useB) w |= 2u << 11;
                      if (useC) w |= 3u << 6;
                  }
                  int bad = 0; char why[200] = "";
                  for (size_t t = 0; t < sizeof V / sizeof V[0] && !bad; t++) {
                      double a = V[t][0], b = V[t][1], c = V[t][2];
                      uint32_t x = keys[k] & 0x7fff;
                      if (!(keys[k] & 0x8000) && (x == 22 || x == 24 || x == 26)) b = fabs(b) + 0.5;
                      uint32_t code = heap_alloc(16);                  /* alamat baru tiap uji (hindari cache JIT) */
                      uint8_t *p = g2h(code, 8); wbe32(p, w); wbe32(p + 4, 0x4e800020u);
                      SF(1, a); SF(2, b); SF(3, c); SFbits(4, 0x7ff8deadbeef0000ull);
                      W(3, scratch); W(1, INIT_SP); WLR(RET_SENTINEL);
                      int rr = run_guest(code, 1.0);
                      if (rr != 2) { bad = 1; snprintf(why, sizeof why, "eksekusi gagal (kode %d)", rr); break; }
                      uint64_t got = Fbits(4), want = 0;
                      SF(1, a); SF(2, b); SF(3, c);
                      uint32_t wr = (w & ~(31u << 21)) | (4u << 21);
                      fp_eval(wr, &want);
                      double gd = bits2d(got), wd = bits2d(want);
                      int ok;
                      if (keys[k] & 0x8000) ok = (got == want) || ((x == 14 || x == 15) && (uint32_t)got == (uint32_t)want);
                      else if (x == 24) ok = fabs(gd - wd) <= fabs(wd) / 200.0;
                      else if (x == 26) ok = fabs(gd - wd) <= fabs(wd) / 30.0;
                      else if ((keys[k] >> 16) == 59) ok = (got == want) || fabs(gd - wd) <= fabs(wd) * 2e-7;
                      else ok = (got == want) || fabs(gd - wd) <= fabs(wd) * 1e-15;
                      if (!ok) { bad = 1; snprintf(why, sizeof why, "a=%g b=%g c=%g -> emulator %.9g (%016llx), seharusnya %.9g", a, b, c, gd, (unsigned long long)got, wd, (unsigned long long)want); }
                  }
                  LOG("  %-8s %s %s\n", fp_name(keys[k]), bad ? "SALAH" : "ok", why);
                  if (bad && g_nfp_bad < 48) g_fp_bad[g_nfp_bad++] = keys[k];
              }
              /* lfs / stfs */
              {
                  float fv = 1.1f; uint32_t fb; memcpy(&fb, &fv, 4);
                  wbe32(g2h(scratch, 4), fb);
                  uint32_t code = heap_alloc(16); uint8_t *p = g2h(code, 8);
                  wbe32(p, (48u << 26) | (4u << 21) | (3u << 16)); wbe32(p + 4, 0x4e800020u);
                  W(3, scratch); W(1, INIT_SP); WLR(RET_SENTINEL); run_guest(code, 1.0);
                  LOG("  %-8s %s (%.9g)\n", "lfs", F(4) == (double)fv ? "ok" : "SALAH", F(4));
                  code = heap_alloc(16); p = g2h(code, 8);
                  wbe32(p, (52u << 26) | (1u << 21) | (3u << 16)); wbe32(p + 4, 0x4e800020u);
                  SF(1, -7.3); W(3, scratch); W(1, INIT_SP); WLR(RET_SENTINEL); run_guest(code, 1.0);
                  uint32_t got = rd32(scratch); float want = -7.3f; uint32_t wb; memcpy(&wb, &want, 4);
                  LOG("  %-8s %s (%08x vs %08x)\n", "stfs", got == wb ? "ok" : "SALAH", got, wb);
              }
              LOG("hasil uji FPU: %d jenis instruksi salah\n", g_nfp_bad);
              if (!g_nfp_bad || !fix) { if (g_nfp_bad) LOG("perbaikan FPU dimatikan (LUXOR_FPFIX=0)\n"); return; }
              unsigned cnt[48] = {0}, total = 0;
              for (int i = 0; i < g_nimg; i++) {
                  Image *im = g_img[i];
                  for (int s = 0; s < im->nsects; s++) {
                      Sect *t = &im->sects[s];
                      if (strcmp(t->name, "__text")) continue;
                      uint32_t base = t->addr + im->slide;
                      for (uint32_t o = 0; o + 4 <= t->size; o += 4) {
                          uint32_t w = rd32(base + o), k = fp_key(w);
                          if (!k) continue;
                          for (int b = 0; b < g_nfp_bad; b++) if (g_fp_bad[b] == k) {
                              uc_hook h;
                              if (uc_hook_add(g_uc, &h, UC_HOOK_CODE, (void *)hook_fpemu, NULL, base + o, base + o) == UC_ERR_OK) { cnt[b]++; total++; }
                              break;
                          }
                      }
                  }
              }
              for (int b = 0; b < g_nfp_bad; b++) LOG("  perbaikan %-8s: %u lokasi\n", fp_name(g_fp_bad[b]), cnt[b]);
              LOG("perbaikan FPU: %u instruksi ditangani loader\n", total);
          }
          #else
          static void fpu_selftest_and_fix(void) { LOG("uji FPU dilewati (tanpa register FPR)\n"); }
          #endif
          /* stfs di Unicorn memotong (truncate) double->float, bukan membulatkan ke terdekat seperti CPU asli
           * (uji: -7.3 -> c0e99999, seharusnya c0e9999a).  Perbaikan opsional: LUXOR_STFS_FIX=1 (default) */
          static unsigned long g_stfs_calls;
          static void hook_stfs(uc_engine *uc, uint64_t addr, uint32_t size, void *ud)
          {
              (void)uc; (void)size; (void)ud;
              uint32_t w = rd32((uint32_t)addr), op = w >> 26;
              int rs = (w >> 21) & 31, ra = (w >> 16) & 31, rb = (w >> 11) & 31;
              uint32_t ea;
              if (op == 52 || op == 53) { int32_t d = (int16_t)(w & 0xffff); ea = (ra ? R(ra) : 0) + (uint32_t)d; }
              else ea = (ra ? R(ra) : 0) + R(rb);
              float f = (float)F(rs);
              uint32_t u; memcpy(&u, &f, 4);
              uint8_t *p = g2h(ea, 4);
              if (!p) return;                               /* biarkan emulator yang menangani (akan error) */
              wbe32(p, u);
              if (op == 53 || (op == 31 && ((w >> 1) & 0x3ff) == 695)) W(ra, ea);
              g_stfs_calls++; g_fpemu_total++;
              WPC((uint32_t)addr + 4);
          }
          static void install_stfs_fix(void)
          {
              const char *e = getenv("LUXOR_STFS_FIX");
              if (!e || atoi(e) == 0) { LOG("[stfs] perbaikan pembulatan nonaktif (aktifkan: LUXOR_STFS_FIX=1, lambat)\n"); return; }
              unsigned total = 0;
              for (int i = 0; i < g_nimg; i++) {
                  Image *im = g_img[i];
                  if (strcmp(im->short_name, "Luxor") && strcmp(im->short_name, "gfx2d") && strcmp(im->short_name, "ui2") && strcmp(im->short_name, "core")) continue;
                  for (int s = 0; s < im->nsects; s++) {
                      Sect *t = &im->sects[s];
                      if (strcmp(t->name, "__text")) continue;
                      uint32_t base = t->addr + im->slide;
                      for (uint32_t o = 0; o + 4 <= t->size; o += 4) {
                          uint32_t w = rd32(base + o), op = w >> 26, xo = (w >> 1) & 0x3ff;
                          if (!(op == 52 || op == 53 || (op == 31 && (xo == 663 || xo == 695)))) continue;
                          uc_hook h;
                          if (uc_hook_add(g_uc, &h, UC_HOOK_CODE, (void *)hook_stfs, NULL, base + o, base + o) == UC_ERR_OK) total++;
                      }
                  }
              }
              LOG("[stfs] %u instruksi stfs (Luxor/gfx2d/ui2/core) dibulatkan dengan benar oleh loader\n", total);
          }
          static void install_game_hooks(void)
          {
              uint32_t a = 0;
              if (sym_find_any("__ZNK11uiGameLevel9fixDValueERiS0_Rf", &a)) {
                  uc_hook h;
                  uc_err e = uc_hook_add(g_uc, &h, UC_HOOK_CODE, (void *)hook_fixd, NULL, a, a);
                  LOG("[fixD] hook @%08x: %s\n", a, uc_strerror(e));
                  uc_hook h2; e = uc_hook_add(g_uc, &h2, UC_HOOK_CODE, (void *)hook_fixd_loop2, NULL, a + 0x94, a + 0x94);
                  LOG("[fixD] hook loop2 @%08x: %s (insn %08x)\n", a + 0x94, uc_strerror(e), rd32(a + 0x94));
                  uc_hook h4; e = uc_hook_add(g_uc, &h4, UC_HOOK_CODE, (void *)hook_fixd_cmp, NULL, a + 0xa8, a + 0xa8);
                  LOG("[fixD] hook cmp @%08x: %s (insn sebelumnya %08x)\n", a + 0xa8, uc_strerror(e), rd32(a + 0xa4));
              } else LOG("[fixD] simbol tidak ditemukan\n");
              if (sym_find_any("__ZNK11uiGameLevel19getNextNodeDistanceEii", &a)) {
                  uc_hook h3; uc_hook_add(g_uc, &h3, UC_HOOK_CODE, (void *)hook_gnd, NULL, a, a);
              }
          }
          static void install_hooks(void)
          {
              uc_hook h1, h2, h3, h4;
              { const char *m = getenv("LUXOR_HLE_MODE"); if (m && !strcmp(m, "sc")) g_hle_sc_mode = 1; }
              if (!g_hle_sc_mode) uc_hook_add(g_uc, &h1, UC_HOOK_CODE, (void *)hook_code, NULL, TRAP_BASE, TRAP_BASE + TRAP_SIZE - 1);
              LOG("HLE: %s\n", g_hle_sc_mode ? "lewat instruksi sc (tanpa hook kode)" : "hook kode (lama)");
              uc_hook_add(g_uc, &h2, UC_HOOK_MEM_READ_UNMAPPED | UC_HOOK_MEM_WRITE_UNMAPPED | UC_HOOK_MEM_FETCH_UNMAPPED,
                          (void *)hook_unmapped, NULL, 1, 0);
              if (g_blocktrace) uc_hook_add(g_uc, &h3, UC_HOOK_BLOCK, (void *)hook_block, NULL, 1, 0);
              if (g_insntrace) uc_hook_add(g_uc, &h4, UC_HOOK_CODE, (void *)hook_insn, NULL, 1, 0);
              uc_hook h5;
              uc_err e = uc_hook_add(g_uc, &h5, UC_HOOK_INTR, (void *)hook_intr, NULL, 1, 0);
              LOG("hook exception: %s\n", uc_strerror(e));
          }
          #endif /* !DRYRUN */


          static const HleDef *hle_def_find(const char *name)
          {
              for (const HleDef *d = g_defs; d->name; d++)
                  if (!strcmp(d->name, name)) return d;
              return NULL;
          }

          /* ----------------------------------------------------------------- main */
          /* cari simbol (termasuk simbol lokal/privat) di tabel simbol semua image */
          static int sym_find_any(const char *name, uint32_t *addr)
          {
              for (int i = 0; i < g_nimg; i++) {
                  Image *im = g_img[i];
                  for (int k = 0; k < im->nsymrec; k++)
                      if (im->syms[k].name && !strcmp(im->syms[k].name, name)) { *addr = im->syms[k].addr; return 1; }
              }
              return 0;
          }
          /* ===== mode tanpa suara: fungsi pemuat FMOD di snd3d ditambal jadi "return 0" (gagal muat, tanpa decode) =====
           * Aktif bila env LUXOR_NOSOUND=1 (default di launcher). */
          static void patch_nosound(void)
          {
              const char *e = getenv("LUXOR_NOSOUND");
              if (!e || atoi(e) == 0) { LOG("[nosound] nonaktif (suara dimuat normal)\n"); return; }
              static const char *fn[] = {
                  "_FSOUND_Sample_Load", "_FSOUND_Sample_LoadEx", "_FSOUND_Sample_LoadFromFile",
                  "_FSOUND_Stream_Open", "_FSOUND_Stream_OpenFile", "_FSOUND_Stream_OpenEx",
                  "_FMUSIC_LoadSong", "_FMUSIC_LoadSongEx", "_FSOUND_OggVorbis_Load",
                  "__ZN16snd3dSample_fmod6createEPKcb", NULL };
              for (int i = 0; fn[i]; i++) {
                  uint32_t ad = 0;
                  if (!exp_find(fn[i], &ad) && !sym_find_any(fn[i], &ad)) { LOG("[nosound] %s tidak ada\n", fn[i]); continue; }
                  uint8_t *p = g2h(ad, 8);
                  if (!p) continue;
                  wbe32(p, 0x38600000u);        /* li r3,0 */
                  wbe32(p + 4, 0x4e800020u);    /* blr     */
                  LOG("[nosound] %s @%08x -> return 0\n", fn[i], ad);
              }
          }

          static void print_image_report(Image *im)
          {
              LOG("  [%2d] %-14s slide=%08x  guest=[%08x..%08x)  dep=%d  extrel=%d(addend!=0:%d) rebase=%d lazy=%d nonlazy=%d nl_local+slide=%d odd=%d\n",
                  im->idx, im->short_name, im->slide, im->lo, im->hi, im->ndeps, im->n_extrel, im->n_extrel_addend,
                  im->n_rebase, im->n_lazy, im->n_nonlazy, im->n_nl_local, im->n_odd_reloc);
          }

          int main(int argc, char **argv)
          {
              const char *app = argc > 1 ? argv[1] : "Luxor_Mac/Luxor.app";
              for (int i = 2; i < argc; i++) {
          #ifndef DRYRUN
                  if (!strcmp(argv[i], "--trace")) g_trace = 1;
                  else if (!strcmp(argv[i], "--tcg-mb") && i + 1 < argc) g_tcg_mb = atoi(argv[++i]);
                  else if (!strcmp(argv[i], "--frames") && i + 1 < argc) g_frames = atoi(argv[++i]);
                  else if (!strcmp(argv[i], "--no-boot")) g_noboot = 1;
                  else if (!strcmp(argv[i], "--fast")) g_blocktrace = 0;
                  else if (!strcmp(argv[i], "--insn")) g_insntrace = 1;
                  else if (!strcmp(argv[i], "--cpu") && i + 1 < argc) g_cpu_req = argv[++i];
                  else if (!strcmp(argv[i], "--no-fb")) g_use_fb = 0;
          #endif
              }
              { const char *e = getenv("LUXOR_DEBUG"); if (e && atoi(e)) g_blocktrace = 1; }
              { const char *e = getenv("LUXOR_EMU_COUNT"); if (e && atoi(e)) g_use_count = 1; }
              g_logf = fopen("loader_log.txt", "w");
              LOG("luxor_mac_loader M1 (probe) r46-audio\napp: %s\n", app);
          #ifndef DRYRUN
              signal(SIGABRT, crash_handler);
              signal(SIGSEGV, crash_handler);
              signal(SIGBUS, crash_handler);
              signal(SIGFPE, crash_handler);
              signal(SIGILL, crash_handler);
          #endif

          #ifndef DRYRUN
              probe_rwx();
              setup_cpu();
              signal(SIGTERM, sig_quit);
              signal(SIGINT, sig_quit);
              start_input_thread();
          #endif
              char exe[700];
              snprintf(g_exe_dir, sizeof g_exe_dir, "%s/Contents/MacOS", app);
              snprintf(exe, sizeof exe, "%s/Luxor", g_exe_dir);

              /* region umum */
              map_region("heap", HEAP_BASE, HEAP_SIZE);
              map_region("hle-data", DATA_BASE, DATA_SIZE);
              map_region("hle-trap", TRAP_BASE, TRAP_SIZE);
              wbe32(g2h(TRAP_BASE, 4), 0x44000002);                      /* slot 0 (sentinel) = sc ; blr */
              wbe32(g2h(TRAP_BASE + 4, 4), 0x4e800020);
          #ifndef DRYRUN
              {
                  const char *m = getenv("LUXOR_HLE_MODE");
                  if (m && !strcmp(m, "fetch")) {
                      uc_err pe = uc_mem_protect(g_uc, TRAP_BASE, TRAP_SIZE, UC_PROT_READ | UC_PROT_WRITE);
                      LOG("HLE mode: fetch (area trap non-exec) -> %s\n", uc_strerror(pe));
                  } else LOG("HLE mode: hook + cadangan 'sc' (default)\n");
              }
          #endif
              map_region("native", NATIVE_BASE, NATIVE_SIZE);
              { const char *e = getenv("LUXOR_NATIVE"); if (e && !atoi(e)) g_native_on = 0; }
              {   /* slot trap cadangan untuk memset besar */
                  Hle *mh; hle_symbol("<memset_besar>", 0); mh = hle_find("<memset_besar>");
                  if (mh) { mh->fn = h_memset; mh->known = 1; }
              }
              hle_state_init();
              snprintf(g_app_path, sizeof g_app_path, "%s", app);
              {
                  char cwd[500];
                  if (!getcwd(cwd, sizeof cwd)) snprintf(cwd, sizeof cwd, ".");
                  snprintf(g_appdata, sizeof g_appdata, "%s/appdata", cwd);
                  snprintf(g_shot_dir, sizeof g_shot_dir, "%s/frames", cwd);
                  mkdir(g_shot_dir, 0755);
                  mkdir(g_appdata, 0755);
                  LOG("appdata: %s\n", g_appdata);
              }
              map_region("stack", STACK_TOP - STACK_SIZE, STACK_SIZE);

              /* muat image: exe lebih dulu (indeks 0), lalu framework */
              Image *mainimg = load_image(exe, 1);
              snprintf(mainimg->install, sizeof mainimg->install, "<exe>");
              load_tree(mainimg);

              LOG("\n== Image termuat: %d, export global: %zu ==\n", g_nimg, g_nexp);

              for (int i = 0; i < g_nimg; i++) fixup_image(g_img[i]);
              for (int i = 0; i < g_nimg; i++) objc_register_classes(g_img[i]);   /* exe + framework (MJWindow di core, MJOpenGLView di gfx2d_ogl) */
              /* isi section __DATA,__dyld seperti yang dilakukan dyld asli (crt1 memeriksa ini) */
              for (int i = 0; i < g_nimg; i++) {
                  Image *im = g_img[i];
                  for (int si = 0; si < im->nsects; si++) {
                      Sect *t = &im->sects[si];
                      if (strcmp(t->seg, "__DATA") || strcmp(t->name, "__dyld") || t->size < 8) continue;
                      uint8_t *p = g2h(t->addr + im->slide, 8);
                      if (!p) continue;
                      wbe32(p, hle_symbol("<dyld_lazy_binder>", 0));
                      wbe32(p + 4, hle_symbol("<dyld_func_lookup>", 0));
                      LOG("  __dyld %s: diisi\n", im->short_name);
                  }
              }
              patch_nosound();
              audio_patch();
              for (int i = 0; i < g_nimg; i++) print_image_report(g_img[i]);
              print_hle_summary();

              LOG("\n== Urutan inisialisasi ==\n");
              for (int i = 0; i < g_norder; i++) {
                  Image *im = g_order[i];
                  for (int s = 0; s < im->nsects; s++) {
                      Sect *t = &im->sects[s];
                      if ((t->flags & 0xff) != 9) continue;
                      for (uint32_t k = 0; k < t->size / 4; k++) {
                          uint8_t *p = g2h(t->addr + im->slide + k * 4, 4);
                          LOG("  %-14s init[%u] = %s\n", im->short_name, k, p ? describe(be32(p)) : "?");
                      }
                  }
              }
              LOG("\nentry exe = %08x (%s)\n", mainimg->entry, describe(mainimg->entry));

          #ifdef DRYRUN
              g_logcut = 0;
              print_unimplemented();
              LOG("\nDRYRUN selesai (emulator tidak dijalankan).\n");
              return 0;
          #else
              enable_fpu_altivec();
              install_hooks();
              install_fcmp_fix();
              prof_start();
              fpu_selftest_and_fix();
              install_stfs_fix();
              if (getenv("LUXOR_DEBUG_FIXD")) install_game_hooks();

              /* jalankan initializer: dependensi dulu, exe terakhir */
              for (int i = 0; i < g_norder; i++) {
                  Image *im = g_order[i];
                  for (int s = 0; s < im->nsects; s++) {
                      Sect *t = &im->sects[s];
                      if ((t->flags & 0xff) != 9) continue;
                      for (uint32_t k = 0; k < t->size / 4; k++) {
                          uint8_t *p = g2h(t->addr + im->slide + k * 4, 4);
                          uint32_t fn = p ? be32(p) : 0;
                          if (!fn || fn == 0xffffffffu) continue;
                          LOG("-> init %s[%u] @ %s\n", im->short_name, k, describe(fn));
                          int r = call_guest(fn, 30.0);
                          if (r != 2) { LOG("initializer tidak kembali normal (kode %d): %s\n", r, g_stop_reason); goto done; }
                      }
                  }
              }

              /* stack awal: [argc][argv0][0][envp: kosong][0][apple0][0] */
              {
                  uint32_t sp = STACK_TOP - 0x1000;
                  char path[700];
                  snprintf(path, sizeof path, "%s", exe);
                  uint32_t slen = (uint32_t)strlen(path) + 1;
                  uint32_t sa = sp - 0x400;
                  memcpy(g2h(sa, slen), path, slen);
                  sp -= 0x800;
                  uint8_t *st = g2h(sp, 32);
                  wbe32(st + 0, 1);            /* argc */
                  wbe32(st + 4, sa);           /* argv[0] */
                  wbe32(st + 8, 0);            /* argv terminator */
                  wbe32(st + 12, 0);           /* envp terminator */
                  wbe32(st + 16, sa);          /* apple[0] */
                  wbe32(st + 20, 0);
                  W(1, sp);
                  WLR(RET_SENTINEL);
                  LOG("\n-> start (entry %08x), sp=%08x\n", mainimg->entry, sp);
                  int r = run_guest(mainimg->entry, 120.0);
                  LOG("\nhasil run_guest = %d: %s\n", r, g_stop_reason);
                  if (r == 1 && g_boot && !g_noboot) stage2(g_frames);
              }
          done:
              g_logcut = 0;
              print_call_stats();
              print_unimplemented();
              LOG("\nSelesai.\n");
              fbdev_clear_exit();
              return 0;
          #endif
          }
          LOADER_C_EOF
          cat > src/Luxor_Mac.sh <<'LUXOR_SH_EOF'
          #!/bin/sh
          # Luxor Mac (PowerPC) -> Linux ARM64 | Milestone 1 | peluncur diagnostik v21 (muOS)
          # Skrip ini di ROMS/Ports ; folder "luxor_mac" (berisi luxor_mac_loader dan Luxor_Mac/Luxor.app)
          # dicari otomatis di beberapa lokasi umum.
          DIR="$(cd "$(dirname "$0")" 2>/dev/null && pwd)"
          L1="$DIR/luxor_mac_launcher.txt"

          {
            echo "== peluncur v21 mulai: $(date 2>&1)"
            echo "script : $0"
            echo "DIR    : $DIR"
          } > "$L1" 2>&1

          # --- cari folder game ---
          GAME=""
          for c in "$DIR/luxor_mac" \
                   /mnt/sdcard/ports/luxor_mac /mnt/mmc/ports/luxor_mac /mnt/union/ports/luxor_mac \
                   /mnt/sdcard/ROMS/Ports/luxor_mac /mnt/mmc/ROMS/Ports/luxor_mac /mnt/union/ROMS/Ports/luxor_mac \
                   /mnt/sdcard/ports/luxor_mac_loader /mnt/mmc/ports/luxor_mac_loader; do
            if [ -f "$c/luxor_mac_loader" ]; then GAME="$c"; break; fi
          done
          if [ -z "$GAME" ]; then
            F="$(find /mnt -maxdepth 5 -name luxor_mac_loader 2>/dev/null | head -1)"
            [ -n "$F" ] && GAME="$(dirname "$F")"
          fi

          if [ -z "$GAME" ]; then
            {
              echo "ERROR: luxor_mac_loader TIDAK DITEMUKAN di mana pun."
              echo "-- ls /mnt:";                   ls -la /mnt 2>&1
              echo "-- ls /mnt/sdcard:";            ls -la /mnt/sdcard 2>&1 | head -40
              echo "-- ls /mnt/sdcard/ports:";      ls -la /mnt/sdcard/ports 2>&1 | head -60
              echo "-- ls /mnt/mmc:";               ls -la /mnt/mmc 2>&1 | head -40
              echo "-- ls /mnt/union:";             ls -la /mnt/union 2>&1 | head -40
            } >> "$L1" 2>&1
            exit 1
          fi

          L2="$GAME/luxor_mac_launcher.txt"
          {
            echo "GAME   : $GAME"
            echo "uname  : $(uname -a 2>&1)"
            echo "-- isi GAME:";       ls -la "$GAME" 2>&1
            echo "-- isi Luxor_Mac:";  ls -la "$GAME/Luxor_Mac" 2>&1
          } >> "$L1" 2>&1

          cd "$GAME" || { echo "ERROR: cd ke $GAME gagal" >> "$L1"; exit 1; }

          BIN="$GAME/luxor_mac_loader"
          chmod +x "$BIN" 2>/dev/null
          if [ ! -x "$BIN" ]; then
            echo "binary tidak executable di SD, disalin ke /tmp" >> "$L1"
            cp "$BIN" /tmp/luxor_mac_loader && chmod +x /tmp/luxor_mac_loader && BIN=/tmp/luxor_mac_loader
          fi

          APP="$GAME/Luxor_Mac/Luxor.app"
          [ -d "$APP" ] || APP="$GAME/Luxor.app"
          echo "BIN: $BIN" >> "$L1"
          echo "APP: $APP" >> "$L1"
          [ -d "$APP/Contents/MacOS" ] || echo "PERINGATAN: $APP/Contents/MacOS tidak ada" >> "$L1"

          rm -rf "$GAME/frames"
          # Kontrol: D-pad/stick = kursor, A = klik kiri, B = klik kanan, L1 = kursor pelan
          # tombol kode 306 = ketik nama (LUXOR_NAME) + Enter, kode 307 = Backspace, R1 = Enter
          export LUXOR_NAME="${LUXOR_NAME:-PLAYER}"
          # 1 = catat fungsi game yang paling berat (diagnosa kecepatan, sedikit menambah beban)
          export LUXOR_PROFILE="${LUXOR_PROFILE:-0}"
          # langkah waktu game maks per frame (ms). Kecil = tumbukan akurat tapi game melambat saat fps rendah; 0 = nonaktif
          export LUXOR_MAX_DT_MS="${LUXOR_MAX_DT_MS:-0}"
          # batas waktu darurat (detik); 0 = tanpa batas. Keluar manual: SELECT+START atau tahan MENU 1 detik
          export LUXOR_TIMEOUT="${LUXOR_TIMEOUT:-0}"
          # 1 = lewati pemuatan suara (tes sampai main menu); 0 = muat suara
          export LUXOR_NOSOUND="${LUXOR_NOSOUND:-0}"
          # 1 = keluarkan suara lewat aplay (ALSA); 0 = muat suara tapi tanpa keluaran
          export LUXOR_AUDIO="${LUXOR_AUDIO:-1}"
          { echo "-- memori:"; head -4 /proc/meminfo 2>&1; echo "overcommit: $(cat /proc/sys/vm/overcommit_memory 2>&1)"; echo "ulimit -v: $(ulimit -v 2>&1)"; } >> "$L1" 2>&1
          # buffer JIT: dari besar ke kecil sampai berhasil dialokasikan
          MB=64
          for M in 64 32 16 8; do
            MB=$M
            "$BIN" "$APP" --tcg-mb $MB --frames ${LUXOR_FRAMES:-0} > "$GAME/loader_stdout.txt" 2>&1
            RC=$?
            echo "percobaan buffer JIT ${MB}MB -> exit code: $RC" >> "$L1"
            grep -q "Could not allocate dynamic translator" "$GAME/loader_stdout.txt" || break
          done
          cp "$GAME/loader_log.txt" "$GAME/loader_log_cpu_build.txt" 2>/dev/null

          # kalau abort/crash (exit >=128), coba model CPU lain; tiap percobaan punya log sendiri
          if [ "$RC" -ge 128 ]; then
            for CPU in 750 7400 7410 7450 default; do
              "$BIN" "$APP" --tcg-mb $MB --frames ${LUXOR_FRAMES:-0} --cpu $CPU > "$GAME/loader_stdout_cpu_$CPU.txt" 2>&1
              RC=$?
              cp "$GAME/loader_log.txt" "$GAME/loader_log_cpu_$CPU.txt" 2>/dev/null
              echo "percobaan CPU $CPU -> exit code: $RC" >> "$L1"
              [ "$RC" -lt 128 ] && break
            done
          fi
          echo "loader selesai, exit code terakhir: $RC" >> "$L1"
          echo "-- screenshot frames/:" >> "$L1"; ls -la "$GAME/frames" >> "$L1" 2>&1
          cp "$L1" "$L2" 2>/dev/null
          exit 0
          LUXOR_SH_EOF
          wc -c src/loader.c src/Luxor_Mac.sh

      - name: Pasang tool build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3 file

      - name: Build Unicorn (hanya PPC, statis)
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/unicorn-engine/unicorn.git
          cmake -S unicorn -B unicorn/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNICORN_ARCH=ppc \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_TESTS=OFF
          cmake --build unicorn/build -j"$(nproc)"

      - name: Build loader
        run: |
          SRC=src/loader.c
          grep -oE 'UC_CPU_PPC32_[A-Za-z0-9_]+' unicorn/include/unicorn/ppc.h | sort -u > models.txt || true
          MODEL=""
          for pat in 7447A 7447 7457 7450 7455 7410 7400 750 745; do
            m=$(grep -E "UC_CPU_PPC32_${pat}(_|$)" models.txt | head -1 || true)
            if [ -n "$m" ]; then MODEL="$m"; break; fi
          done
          echo "Model CPU terpilih: '${MODEL}'"
          EXTRA=()
          if [ -n "$MODEL" ]; then
            EXTRA=("-DLUXOR_CPU_MODEL=$MODEL" "-DLUXOR_CPU_MODEL_STR=\"$MODEL\"")
          fi
          grep -q "UC_PPC_REG_FPR0" unicorn/include/unicorn/ppc.h && EXTRA+=("-DLUXOR_HAVE_FPR")
          grep -q "UC_PPC_REG_FPSCR" unicorn/include/unicorn/ppc.h && EXTRA+=("-DLUXOR_HAVE_FPSCR")
          grep -qE "UC_PPC_REG_CR\b" unicorn/include/unicorn/ppc.h && EXTRA+=("-DLUXOR_HAVE_CR")
          # tabel semua model CPU PPC32 supaya bisa dipilih saat runtime (--cpu / LUXOR_CPU)
          {
            echo 'static const struct { const char *name; int id; } g_cpu_models[] = {'
            while read -r m; do [ -n "$m" ] && echo "  {\"$m\", $m},"; done < models.txt
            echo '  {0, 0}'
            echo '};'
          } > src/cpu_models.h
          if [ -s models.txt ]; then EXTRA+=("-DLUXOR_HAVE_CPU_TABLE" "-Isrc"); fi
          echo "jumlah model CPU: $(wc -l < models.txt)"
          grep -q "uc_ctl_set_tcg_buffer_size" unicorn/include/unicorn/unicorn.h && EXTRA+=("-DHAVE_TCG_BUFFER_CTL")
          echo "Flag: ${EXTRA[*]}"
          mkdir -p out/luxor_mac
          gcc -O2 -Wall -Iunicorn/include "${EXTRA[@]}" "$SRC" -o out/luxor_mac/luxor_mac_loader \
            -static -Wl,--start-group $(find unicorn/build -name '*.a' | tr '\n' ' ') -Wl,--end-group -lpthread -lm
          strip out/luxor_mac/luxor_mac_loader
          file out/luxor_mac/luxor_mac_loader

      - name: Uji jalan (harus gagal rapi, tidak ada game di sini)
        run: |
          cd out/luxor_mac
          ./luxor_mac_loader /tidak/ada/Luxor.app || true
          head -20 loader_log.txt || true
          rm -f loader_log.txt; rm -rf appdata

      - name: Siapkan paket
        run: |
          cp src/Luxor_Mac.sh out/Luxor_Mac.sh
          chmod +x out/Luxor_Mac.sh out/luxor_mac/luxor_mac_loader
          echo "Salin folder Luxor_Mac/ (berisi Luxor.app) ke dalam luxor_mac/" > out/luxor_mac/BACA_SAYA.txt
          find out -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: luxor-mac-loader
          path: out/
