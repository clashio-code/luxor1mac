          static void hook_insn(uc_engine *uc, uint64_t address, uint32_t size, void *ud)
          {
              (void)uc; (void)size; (void)ud;
              g_lastins[g_inspos++ & 255] = (uint32_t)address;
          }

          static void hook_block(uc_engine *uc, uint64_t address, uint32_t size, void *ud)
          {
              (void)uc; (void)size; (void)ud;
              g_lastblk[g_blkpos++ & 63] = (uint32_t)address;
          }

          static void crash_handler(int sig)
          {
              char buf[6200];
              int n = 0;
              n += snprintf(buf + n, sizeof buf - n, "\n!! SINYAL %d (%s) pada proses loader\n", sig,
                            sig == SIGABRT ? "abort" : sig == SIGSEGV ? "segfault" : sig == SIGBUS ? "bus error" : "lain");
              n += snprintf(buf + n, sizeof buf - n, "   frame=%d  HLE terakhir=%s  heap terpakai=%u KB\n",
                            g_curframe, g_lasthle ? g_lasthle : "-", (unsigned)((g_heap_ptr - HEAP_BASE) / 1024));
              n += snprintf(buf + n, sizeof buf - n, "   blok guest terakhir (terbaru dulu):\n");
              unsigned pos = g_blkpos;
              for (int i = 0; i < 20 && n < (int)sizeof buf - 240; i++) {
                  uint32_t a = g_lastblk[(pos - 1 - (unsigned)i) & 63];
                  n += snprintf(buf + n, sizeof buf - n, "     %s\n", describe(a));
              }
              if (g_insntrace) {
                  n += snprintf(buf + n, sizeof buf - n, "   instruksi guest terakhir (terbaru dulu; alamat: kode  fungsi):\n");
                  unsigned ip = g_inspos;
                  for (int i = 0; i < 24 && n < (int)sizeof buf - 260; i++) {
                      uint32_t a = g_lastins[(ip - 1 - (unsigned)i) & 255];
                      n += snprintf(buf + n, sizeof buf - n, "     %08x: %08x  %s\n", a, rd32(a), describe(a));
                  }
              }
              if (g_logf) { fwrite(buf, 1, (size_t)n, g_logf); fflush(g_logf); }
              if (write(1, buf, (size_t)n) < 0) { /* abaikan */ }
              _exit(128 + sig);
          }

          static void hook_code(uc_engine *uc, uint64_t addr, uint32_t size, void *ud)
          {
              (void)uc; (void)size; (void)ud;
              if (addr == RET_SENTINEL) { g_stop = 2; uc_emu_stop(g_uc); return; }
              uint32_t idx = ((uint32_t)addr - TRAP_BASE) / 16;
              uint32_t lr = RLR();
              static int *slot2hle; static int nslot;
              if (!slot2hle) {                                   /* indeks langsung slot -> entri HLE (dulu dicari linear tiap panggilan) */
                  nslot = (int)(TRAP_SIZE / 16);
                  slot2hle = (int *)malloc(sizeof(int) * (size_t)nslot);
                  for (int i = 0; i < nslot; i++) slot2hle[i] = -1;
                  for (int i = 0; i < g_nhle; i++) if (!g_hle[i].is_data && g_hle[i].addr >= TRAP_BASE) {
                      uint32_t si = (g_hle[i].addr - TRAP_BASE) / 16; if (si < (uint32_t)nslot) slot2hle[si] = i;
                  }
              }
              g_hle_calls_total++;
              for (int i = (idx < (uint32_t)nslot && slot2hle[idx] >= 0) ? slot2hle[idx] : 0; i < g_nhle; i++) {
                  Hle *h = &g_hle[i];
                  if (h->is_data || h->addr != (uint32_t)addr) continue;
                  h->calls++;
                  g_lasthle = h->name;
                  uint32_t a[8];
                  {
                      static int ids[8]; static void *ptrs[8];
                      if (!ids[0]) for (int k = 0; k < 8; k++) { ids[k] = UC_PPC_REG_3 + k; }
                      for (int k = 0; k < 8; k++) ptrs[k] = &a[k];
                      uc_reg_read_batch(g_uc, ids, ptrs, 8);
                  }
                  if (!h->fn && h->calls <= 3)
                      LOG("[HLE-GENERIK] %s(%08x,%08x,%08x,%08x) dari %s\n", h->name, a[0], a[1], a[2], a[3], describe(lr));
                  else if (h->fn && ((g_trace && h->calls <= 40) || h->fn == h_nsappmain || h->fn == h_exit || h->fn == h_abort)) {
                      LOG("[HLE] %s dari %s\n", h->name, describe(lr));
                      if (g_trace && h->calls == 40) LOG("    (... %s dipanggil >40x, log trace untuk fungsi ini disembunyikan)\n", h->name);
                  }
                  uint32_t ret = h->fn ? h->fn(a) : 0;
                  if (g_tail) { uint32_t t = g_tail; g_tail = 0; WPC(t); return; }   /* lompat ke IMP guest, LR tetap */
                  W(3, ret);
                  if (g_use_r4) { W(4, g_r4); g_use_r4 = 0; }
                  WPC(lr);
                  if (g_stop) uc_emu_stop(g_uc);
                  return;
              }
              LOG("[HLE] slot %u tanpa entri @%08x\n", idx, (uint32_t)addr);
              WPC(lr);
          }

          static bool hook_unmapped(uc_engine *uc, uc_mem_type type, uint64_t address, int size, int64_t value, void *ud)
          {
              (void)uc; (void)value; (void)ud;
              LOG("!! akses memori tak terpetakan: type=%d addr=%08x size=%d\n", (int)type, (uint32_t)address, size);
              return false;
          }

          static double now_s(void)
          {
              struct timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return ts.tv_sec + ts.tv_nsec / 1e9;
          }

          /* jalankan emulasi mulai dari pc sampai sentinel / stop / error / timeout */
          /* ===== profiler sampling (LUXOR_PROFILE=1): tiap ~2 ms emulator dihentikan sebentar, PC dicatat,
           * lalu dilanjutkan.  Hasil: fungsi game yang paling banyak memakan waktu CPU. ===== */
          static int g_prof_on;
          static volatile int g_prof_tick;
          static uint32_t *g_prof_pc; static unsigned g_prof_n, g_prof_cap = 200000;
          static void *prof_thread(void *ud)
          {
              (void)ud;
              for (;;) { usleep(2000); if (g_uc) { g_prof_tick = 1; uc_emu_stop(g_uc); } }
              return NULL;
          }
          static void prof_start(void)
          {
              const char *e = getenv("LUXOR_PROFILE");
              if (!e || !atoi(e)) return;
              g_prof_pc = (uint32_t *)malloc(sizeof(uint32_t) * g_prof_cap);
              if (!g_prof_pc) return;
              g_prof_on = 1;
              pthread_t th; pthread_create(&th, NULL, prof_thread, NULL); pthread_detach(th);
              LOG("[prof] profiler aktif (sampel tiap 2 ms)\n");
          }
          static int cmp_u32(const void *a, const void *b) { uint32_t x = *(const uint32_t *)a, y = *(const uint32_t *)b; return (x > y) - (x < y); }
          static void prof_report(void)
          {
              if (!g_prof_on || g_prof_n < 50) return;
              unsigned n = g_prof_n; g_prof_n = 0;
              /* petakan PC -> alamat awal fungsi (simbol terdekat) */
              for (unsigned i = 0; i < n; i++) {
                  uint32_t a = g_prof_pc[i], fs = a;
                  for (int k = 0; k < g_nimg; k++) {
                      Image *im = g_img[k];
                      if (a < im->lo || a >= im->hi) continue;
                      int lo = 0, hi = im->nsymrec - 1;
                      while (lo <= hi) { int mid = (lo + hi) / 2; if (im->syms[mid].addr <= a) { fs = im->syms[mid].addr; lo = mid + 1; } else hi = mid - 1; }
                      break;
                  }
                  g_prof_pc[i] = fs;
              }
              qsort(g_prof_pc, n, sizeof(uint32_t), cmp_u32);
              uint32_t top[15]; unsigned tc[15]; int nt = 0;
              for (unsigned i = 0; i < n;) {
                  unsigned j = i; while (j < n && g_prof_pc[j] == g_prof_pc[i]) j++;
                  unsigned c = j - i;
                  int p = nt < 15 ? nt++ : 14;
                  if (!(p == 14 && nt == 15 && c <= tc[14])) {
                      top[p] = g_prof_pc[i]; tc[p] = c;
                      while (p > 0 && tc[p] > tc[p - 1]) { uint32_t t = top[p]; top[p] = top[p - 1]; top[p - 1] = t; unsigned u = tc[p]; tc[p] = tc[p - 1]; tc[p - 1] = u; p--; }
                  }
                  i = j;
              }
              LOG("[prof] %u sampel, fungsi game terberat:\n", n);
              for (int i = 0; i < nt; i++) LOG("[prof]   %5.1f%%  %s\n", 100.0 * tc[i] / n, describe(top[i]));
          }
          static void enable_fpu_altivec(void);
          static int g_use_count = 0;     /* 1 = cara lama (hitung instruksi, lambat): LUXOR_EMU_COUNT=1 */
          static int run_guest(uint32_t pc, double max_seconds)
          {
              g_stop = 0;
              enable_fpu_altivec();
              double t0 = now_s();
              while (1) {
                  /* Emulasi bisa berhenti (batas 5 juta instruksi) tepat di alamat trap sebelum hook-nya jalan;
                   * saat dilanjutkan, Unicorn kadang tidak memanggil hook di instruksi pertama, sehingga "blr"
                   * di trap dieksekusi tanpa HLE (r3 = argumen, bukan hasil) -> data rusak.  Tangani manual. */
                  if (pc >= TRAP_BASE && pc < TRAP_BASE + TRAP_SIZE && (pc & 15) == 0) {
                      static unsigned g_trap_resume;
                      if (g_trap_resume++ < 5) LOG("[emu] lanjut di trap %08x: HLE dipanggil manual\n", pc);
                      hook_code(g_uc, pc, 4, NULL);
                      if (g_stop) return g_stop;
                      pc = RPC();
                      continue;
                  }
                  /* PENTING untuk kecepatan: parameter "count" Unicorn dipasang sebagai hook per-instruksi
                   * (callback C di SETIAP instruksi guest).  Pakai batas waktu (timeout, mikrodetik) saja. */
                  double left = max_seconds - (now_s() - t0);
                  if (left < 0.001) left = 0.001;
                  uc_err e = g_use_count
                      ? uc_emu_start(g_uc, pc, 0xFFFFFFFFull, 5 * 1000000ull, 0)
                      : uc_emu_start(g_uc, pc, 0xFFFFFFFFull, (uint64_t)(left * 1e6), 0);
                  if (g_stop) return g_stop;                      /* 1 = stop permintaan HLE, 2 = sentinel */
                  if (g_prof_tick) {   /* hanya catat; alur normal (pc = RPC()) yang melanjutkan */
                      g_prof_tick = 0;
                      if (g_prof_n < g_prof_cap) g_prof_pc[g_prof_n++] = RPC();
                  }
                  if (e == UC_ERR_FETCH_PROT || e == UC_ERR_FETCH_UNMAPPED) {
                      /* mode HLE "fetch": area trap tidak boleh dieksekusi, jadi setiap lompatan ke fungsi
                       * tiruan PASTI berhenti di sini (tidak bergantung pada hook kode Unicorn yang kadang terlewat) */
                      uint32_t fp = RPC();
                      if (fp >= TRAP_BASE && fp < TRAP_BASE + TRAP_SIZE) {
                          g_hle_fetch_calls++;
                          hook_code(g_uc, fp, 4, NULL);
                          if (g_stop) return g_stop;
                          pc = RPC();
                          continue;
                      }
                  }
                  if (e != UC_ERR_OK) {
                      char why[200];
                      snprintf(why, sizeof why, "emulator error: %s", uc_strerror(e));
                      dump_state(why);
                      return -1;
                  }
                  pc = RPC();
                  if (now_s() - t0 > max_seconds) {
                      dump_state("timeout (kemungkinan loop tak berujung)");
                      return -2;
                  }
              }
          }

          static int call_guest(uint32_t fn, double max_seconds)
          {
              W(1, INIT_SP);
              WLR(RET_SENTINEL);
              return run_guest(fn, max_seconds);
          }



          /* ===================== bootstrap M2: meniru NSApplicationMain + timer ===================== */
          static int call_guest_args(uint32_t fn, uint32_t a0, uint32_t a1, uint32_t a2, double secs)
          {
              W(3, a0); W(4, a1); W(5, a2);
              W(1, INIT_SP);
              WLR(RET_SENTINEL);
              return run_guest(fn, secs);
          }

          static uint32_t imp_for(uint32_t obj, const char *sel)
          {
              Recv r = classify(obj);
              for (GClass *g = r.gc; g; g = find_gclass(g->super)) {
                  uint32_t imp = find_imp(g->cls, sel);
                  if (imp) return imp;
              }
              return 0;
          }

          /* ===== thread guest kooperatif: tiap frame, setiap thread jalan sebentar (time-slice) lalu
           * register CPU-nya disimpan (uc_context), jadi layar tetap ter-update selama loading. ===== */
          /* simpan/pulihkan register secara eksplisit (uc_context saja ternyata tidak cukup untuk PPC) */
          static void regs_save(GThread *t)
          {
              for (int i = 0; i < 32; i++) uc_reg_read(g_uc, UC_PPC_REG_0 + i, &t->gpr[i]);
              uc_reg_read(g_uc, UC_PPC_REG_PC, &t->pc);
              uc_reg_read(g_uc, UC_PPC_REG_LR, &t->lr);
              uc_reg_read(g_uc, UC_PPC_REG_CTR, &t->ctr);
              uc_reg_read(g_uc, UC_PPC_REG_XER, &t->xer);
              uc_reg_read(g_uc, UC_PPC_REG_MSR, &t->msr);
          #ifdef LUXOR_HAVE_CR
              uc_reg_read(g_uc, UC_PPC_REG_CR, &t->cr);
          #endif
          #ifdef LUXOR_HAVE_FPR
              for (int i = 0; i < 32; i++) uc_reg_read(g_uc, UC_PPC_REG_FPR0 + i, &t->fpr[i]);
          #endif
          }
          static void regs_load(GThread *t)
          {
              for (int i = 0; i < 32; i++) uc_reg_write(g_uc, UC_PPC_REG_0 + i, &t->gpr[i]);
              uc_reg_write(g_uc, UC_PPC_REG_LR, &t->lr);
              uc_reg_write(g_uc, UC_PPC_REG_CTR, &t->ctr);
              uc_reg_write(g_uc, UC_PPC_REG_XER, &t->xer);
              uc_reg_write(g_uc, UC_PPC_REG_MSR, &t->msr);
          #ifdef LUXOR_HAVE_CR
              uc_reg_write(g_uc, UC_PPC_REG_CR, &t->cr);
          #endif
          #ifdef LUXOR_HAVE_FPR
              for (int i = 0; i < 32; i++) uc_reg_write(g_uc, UC_PPC_REG_FPR0 + i, &t->fpr[i]);
          #endif
              uc_reg_write(g_uc, UC_PPC_REG_PC, &t->pc);
          }
          static int g_thr_sync = 1;     /* 1 = thread dijalankan sampai selesai sekaligus (default); 0 = bergantian */
          static double g_thr_ms = 25.0;
          static void thread_slice(GThread *t, double ms)
          {
              if (t->done) return;
              uint32_t pc;
              if (!t->started) {
                  t->started = 1;
                  if (uc_context_alloc(g_uc, (uc_context **)&t->ctx) != UC_ERR_OK) { LOG("[thread] context gagal\n"); t->done = 1; return; }
                  t->sp = heap_alloc(0x100000) + 0x100000 - 0x200;
                  t->sp &= ~15u;
                  W(3, t->arg); W(1, t->sp); WLR(RET_SENTINEL);
                  pc = t->fn;
                  LOG("[thread] mulai tid %x fn=%s sp=%08x\n", t->tid, describe(pc), t->sp);
              } else {
                  uc_context_restore(g_uc, (uc_context *)t->ctx);
                  regs_load(t);
                  pc = t->pc;
              }
              if (g_thr_sync) {
                  LOG("[thread] tid %x dijalankan sampai selesai (mode sync)\n", t->tid);
                  g_in_thr = (int)t->tid; g_slices++;
                  int r = run_guest(pc, 180.0);
                  g_in_thr = -1;
                  t->done = 1;
                  LOG("[thread] tid %x selesai, kode=%d (%s)\n", t->tid, r, r == 2 ? "normal" : g_stop_reason);
                  g_stop = 0;
                  return;
              }
              int tr0 = g_trace; g_trace = 0;
              g_stop = 0;
              enable_fpu_altivec();
              double t0 = mono_s();
              g_in_thr = (int)t->tid; g_slices++;
              uc_err e = uc_emu_start(g_uc, pc, 0xFFFFFFFFull, (uint64_t)(ms * 1000.0), 0);
              g_in_thr = -1;
              g_trace = tr0;
              { double dt = mono_s() - t0; if (dt > 0.5) LOG("[thread] slice tid %x lama %.2fs (diminta %.0f ms) PC=%s\n", t->tid, dt, ms, describe(RPC())); }
              t->used += mono_s() - t0;
              if (g_stop == 2) { t->done = 1; LOG("[thread] tid %x selesai normal (%.1f s CPU)\n", t->tid, t->used); }
              else if (g_stop == 1) { t->done = 1; LOG("[thread] tid %x berhenti: %s\n", t->tid, g_stop_reason); }
              else if (e != UC_ERR_OK) { t->done = 1; char why[120]; snprintf(why, sizeof why, "thread %x: %s", t->tid, uc_strerror(e)); dump_state(why); }
              else { uc_context_save(g_uc, (uc_context *)t->ctx); regs_save(t); }
              g_stop = 0;
          }

          /* gerakkan kursor dan kirim event mouse ke game lewat -[LuxorApplication sendEvent:] */
          static uint32_t g_sendev_imp;
          static int g_prev_l, g_prev_r;
          static double g_last_move_t;
          static void cursor_step(void)
          {
              double now = mono_s();
              double dt = g_last_move_t ? now - g_last_move_t : 1.0 / 30; if (dt > 0.2) dt = 0.2;
              g_last_move_t = now;
              (void)dt;
              static double last_x = -1, last_y = -1;
              int moved = (last_x != g_cur_x || last_y != g_cur_y);
              last_x = g_cur_x; last_y = g_cur_y;
              int l = g_btn_l, r = g_btn_r;
              int types[4], nt = 0;
              if (l && !g_prev_l) types[nt++] = 1;          /* NSLeftMouseDown */
              if (!l && g_prev_l) types[nt++] = 2;          /* NSLeftMouseUp */
              if (r && !g_prev_r) types[nt++] = 3;          /* NSRightMouseDown */
              if (!r && g_prev_r) types[nt++] = 4;          /* NSRightMouseUp */
              if (moved && nt == 0) types[nt++] = l ? 6 : 5;   /* LeftMouseDragged / MouseMoved */
              g_prev_l = l; g_prev_r = r;
              /* antrean tombol keyboard */
              static int kq_ch[40], kq_kc[40], kq_n, kq_i;
              int req = g_key_req; g_key_req = 0;
              if (req && kq_i >= kq_n) {
                  kq_n = kq_i = 0;
                  if (req == 1) {
                      const char *nm = getenv("LUXOR_NAME"); if (!nm || !*nm) nm = "PLAYER";
                      for (int i = 0; nm[i] && kq_n < 30; i++) { kq_ch[kq_n] = (unsigned char)nm[i]; kq_kc[kq_n] = 0; kq_n++; }
                      kq_ch[kq_n] = 13; kq_kc[kq_n] = 36; kq_n++;
                  } else if (req == 2) { kq_ch[0] = 127; kq_kc[0] = 51; kq_n = 1; }
                  else { kq_ch[0] = 13; kq_kc[0] = 36; kq_n = 1; }
                  LOG("[input] keyboard: %d tombol dikirim\n", kq_n);
              }
              if (!g_app_obj) return;
              if (!g_sendev_imp) {
                  g_sendev_imp = imp_for(g_app_obj, "sendEvent:");
                  LOG("[input] -[NSApp sendEvent:] imp=%08x\n", g_sendev_imp);
                  if (!g_sendev_imp) g_sendev_imp = 1;
              }
              if (kq_i < kq_n && nt < 2) {                     /* satu tombol per frame: KeyDown(10) lalu KeyUp(11) */
                  types[nt++] = 10; types[nt++] = 11;
              }
              int kch = kq_i < kq_n ? kq_ch[kq_i] : 0, kkc = kq_i < kq_n ? kq_kc[kq_i] : 0;
              for (int i = 0; i < nt; i++) {
                  GEvent *e = &g_ev[g_nev++ & 15];
                  if (!e->obj) e->obj = new_obj_sys("NSEvent");
                  e->type = types[i]; e->x = win_x(); e->y = win_y();
                  e->ch = (types[i] == 10 || types[i] == 11) ? kch : 0; e->kc = (types[i] == 10 || types[i] == 11) ? kkc : 0;
                  g_cur_event = e->obj;
                  static int evl, kel;
                  if (types[i] == 10 || types[i] == 11) { if (kel < 60) { kel++; LOG("[input] key %s ch=%d ('%c') keyCode=%d\n", types[i] == 10 ? "down" : "up", e->ch, e->ch >= 32 && e->ch < 127 ? e->ch : '?', e->kc); } }
                  else if (evl < 30 && types[i] != 5 && types[i] != 6) { evl++; LOG("[input] event type=%d @%.0f,%.0f\n", types[i], g_cur_x, g_cur_y); }
                  if (g_sendev_imp > 1) {
                      int tr0 = g_trace; g_trace = 0;
                      int rr = call_guest_args(g_sendev_imp, g_app_obj, intern("sendEvent:"), e->obj, 5.0);
                      g_trace = tr0;
                      if (rr != 2) LOG("[input] sendEvent: gagal kode=%d (%s)\n", rr, g_stop_reason);
                  }
              }
              if (kq_i < kq_n && nt >= 2 && types[nt - 1] == 11) kq_i++;
          }
          /* gambar panah kursor sederhana di framebuffer software (setelah game selesai menggambar) */
          static void cursor_draw(void)
          {
              if (!g_fb || !g_cur_show) return;
              static const char *shape[] = {
                  "X           ", "XX          ", "X.X         ", "X..X        ", "X...X       ", "X....X      ",
                  "X.....X     ", "X......X    ", "X.......X   ", "X........X  ", "X.....XXXXX ", "X..X..X     ",
                  "X.X X..X    ", "XX  X..X    ", "X    X..X   ", "     X..X   ", "      XX    ", NULL };
              double s = (double)g_scr_w / 800.0;
              int cx = (int)(g_cur_x * s), cy = (int)(g_cur_y * s);
              int sc = g_scr_w >= 800 ? 2 : 1;
              for (int y = 0; shape[y]; y++)
                  for (int x = 0; shape[y][x]; x++) {
                      char c = shape[y][x]; if (c == ' ') continue;
                      uint32_t col = c == 'X' ? 0xff000000u : 0xffffffffu;
                      for (int yy = 0; yy < sc; yy++) for (int xx = 0; xx < sc; xx++) {
                          int px = cx + x * sc + xx, py = cy + y * sc + yy;
                          if (px >= 0 && py >= 0 && px < g_scr_w && py < g_scr_h) g_fb[(size_t)py * g_scr_w + px] = col;
                      }
                  }
          }
          static int sym_find_any(const char *name, uint32_t *addr);
          /* ===================== AUDIO: FMOD (Mac) -> speaker =====================
           * FMOD Mac memutar lewat CarbonSndPlayDoubleBuffer(chan, header) + callback FSOUND_Output_Mac_Callback
           * yang mengisi salah satu dari 2 buffer.  Di sini CarbonSndPlayDoubleBuffer ditambal ke HLE: loader
           * mencatat header, lalu tiap frame game memanggil callback FMOD untuk mengisi buffer, mengubah PCM
           * big-endian ke little-endian, dan mengirimnya ke thread pemutar (pipe ke "aplay" secara default). */
          static uint32_t g_aud_hdr, g_aud_cb, g_aud_chan;
          static int g_aud_ch = 2, g_aud_bits = 16, g_aud_rate = 44100, g_aud_ok, g_aud_idx;
          static FILE *g_aud_pipe;
          #define AUD_RING (65536 * 4)
          static uint8_t g_aud_ring[AUD_RING];
          static volatile unsigned g_aud_w, g_aud_r;
          static pthread_mutex_t g_aud_mtx = PTHREAD_MUTEX_INITIALIZER;
          static pthread_cond_t g_aud_cv = PTHREAD_COND_INITIALIZER;
          static void *aud_thread(void *ud)
          {
              (void)ud;
              uint8_t buf[4096];
              for (;;) {
                  pthread_mutex_lock(&g_aud_mtx);
                  while (g_aud_w == g_aud_r) pthread_cond_wait(&g_aud_cv, &g_aud_mtx);
                  unsigned n = 0;
                  while (g_aud_r != g_aud_w && n < sizeof buf) { buf[n++] = g_aud_ring[g_aud_r % AUD_RING]; g_aud_r++; }
                  pthread_mutex_unlock(&g_aud_mtx);
                  if (g_aud_pipe && fwrite(buf, 1, n, g_aud_pipe) != n) { LOG("[audio] tulis ke pemutar gagal, audio dimatikan\n"); g_aud_ok = 0; return NULL; }
                  if (g_aud_pipe) fflush(g_aud_pipe);
              }
              return NULL;
          }
          static void aud_open(void)
          {
              const char *fmt = getenv("LUXOR_AUDIO_CMD");
              char cmd[400];
              if (!fmt || !*fmt) fmt = "aplay -q -t raw -f S16_LE -c %d -r %d -B 120000 -";
              snprintf(cmd, sizeof cmd, fmt, g_aud_ch, g_aud_rate);
              signal(SIGPIPE, SIG_IGN);
              g_aud_pipe = popen(cmd, "w");
              LOG("[audio] pemutar: %s -> %s\n", cmd, g_aud_pipe ? "OK" : strerror(errno));
              if (!g_aud_pipe) return;
              pthread_t th; pthread_create(&th, NULL, aud_thread, NULL); pthread_detach(th);
              g_aud_ok = 1;
          }
          static unsigned aud_queued(void) { return g_aud_w - g_aud_r; }
          H(h_SndPlayDoubleBuffer) {
              g_aud_chan = a[0]; g_aud_hdr = a[1];
              uint8_t *h = g2h(a[1], 28);
              if (!h) return (uint32_t)-50;
              g_aud_ch = (int16_t)be16(h);
              g_aud_bits = (int16_t)be16(h + 2);
              g_aud_rate = (int)(be32(h + 8) >> 16);
              LOG("[audio] SndPlayDoubleBuffer: %d ch, %d bit, %d Hz, buf0=%08x buf1=%08x\n", g_aud_ch, g_aud_bits, g_aud_rate, be32(h + 12), be32(h + 16));
              if (g_aud_ch < 1 || g_aud_ch > 2 || g_aud_bits != 16 || g_aud_rate < 8000 || g_aud_rate > 96000) { LOG("[audio] format tidak didukung\n"); return 0; }
              if (!sym_find_any("_FSOUND_Output_Mac_Callback", &g_aud_cb)) { LOG("[audio] callback FMOD tidak ditemukan\n"); return 0; }
              if (!g_aud_ok) aud_open();
              return 0;
          }
          /* dipanggil dari loop game: isi buffer selama antrean pemutar < ~120 ms */
          static void audio_pump(void)
          {
              if (!g_aud_ok || !g_aud_cb || !g_aud_hdr) return;
              unsigned bpf = (unsigned)(g_aud_ch * 2), target = (unsigned)(g_aud_rate * 0.12) * bpf;
              if (aud_queued() == 0 && g_aud_blocks) g_aud_under++;
              double t0 = mono_s();
              for (int guard = 0; guard < 8 && aud_queued() < target; guard++) {
                  uint8_t *h = g2h(g_aud_hdr, 28);
                  uint32_t db = be32(h + 12 + 4 * (uint32_t)g_aud_idx);
                  g_aud_idx ^= 1;
                  int tr0 = g_trace; g_trace = 0;
                  int r = call_guest_args(g_aud_cb, g_aud_chan, db, 0, 2.0);
                  g_trace = tr0;
                  if (r != 2) { LOG("[audio] callback FMOD gagal (kode %d: %s), audio dimatikan\n", r, g_stop_reason); g_aud_ok = 0; return; }
                  uint8_t *d = g2h(db, 16);
                  if (!d) return;
                  uint32_t frames = be32(d);
                  if (frames == 0 || frames > 16384) { if (g_aud_blocks < 3) LOG("[audio] jumlah frame aneh: %u\n", frames); return; }
                  uint8_t *pcm = g2h(db + 16, frames * bpf);
                  if (!pcm) return;
                  pthread_mutex_lock(&g_aud_mtx);
                  for (uint32_t i = 0; i < frames * bpf; i += 2) {          /* BE -> LE */
                      if (g_aud_w - g_aud_r + 2 > AUD_RING) break;
                      g_aud_ring[g_aud_w % AUD_RING] = pcm[i + 1]; g_aud_w++;
                      g_aud_ring[g_aud_w % AUD_RING] = pcm[i];     g_aud_w++;
                  }
                  pthread_cond_signal(&g_aud_cv);
                  pthread_mutex_unlock(&g_aud_mtx);
                  if (g_aud_blocks++ < 3) LOG("[audio] blok %lu: %u frame\n", g_aud_blocks, frames);
              }
              g_aud_t_mix += mono_s() - t0;
          }
          static void audio_patch(void)
          {
              if (getenv("LUXOR_NOSOUND") && atoi(getenv("LUXOR_NOSOUND"))) return;
              const char *e = getenv("LUXOR_AUDIO"); if (e && !atoi(e)) { LOG("[audio] dimatikan (LUXOR_AUDIO=0)\n"); return; }
              uint32_t f = 0;
              if (!sym_find_any("_CarbonSndPlayDoubleBuffer", &f)) { LOG("[audio] CarbonSndPlayDoubleBuffer tidak ditemukan\n"); return; }
              uint32_t tr = hle_symbol("<SndPlayDoubleBuffer>", 0);
              Hle *hh = hle_find("<SndPlayDoubleBuffer>"); if (hh) { hh->fn = h_SndPlayDoubleBuffer; hh->known = 1; }
              uint8_t *p = g2h(f, 16);
              wbe32(p,      0x3d800000u | (tr >> 16));
              wbe32(p + 4,  0x618c0000u | (tr & 0xffff));
              wbe32(p + 8,  0x7d8903a6u);
              wbe32(p + 12, 0x4e800420u);
              g_aud_want = 1;
              LOG("[audio] CarbonSndPlayDoubleBuffer @%08x -> HLE\n", f);
          }
          static double g_frame_timeout = 900.0;   /* frame berat (mis. warmup demo menu) boleh lama */
          static void stage2(int frames)
          {
              LOG("\n===== BOOTSTRAP M2 =====\n");
              GClass *ctl = find_gclass("LuxorController");
              if (!ctl) { LOG("LuxorController tidak ditemukan\n"); return; }
              uint32_t app = the_app(find_gclass("LuxorApplication"));
              uint32_t obj = new_obj_guest(ctl);
              LOG("NSApp=%08x  LuxorController=%08x\n", app, obj);

              uint32_t imp = find_imp(ctl->cls, "applicationDidFinishLaunching:");
              LOG("-> applicationDidFinishLaunching: imp=%08x\n", imp);
              if (!imp) return;
              int r = call_guest_args(imp, obj, intern("applicationDidFinishLaunching:"), 0, 90.0);
              LOG("applicationDidFinishLaunching: selesai, kode=%d (%s)\n", r, g_stop_reason);
              if (r != 2) return;

              uint32_t tgt = g_timer_target ? g_timer_target : obj;
              uint32_t sel = g_timer_sel ? g_timer_sel : intern("gameLoop:");
              uint32_t loop = imp_for(tgt, cs(sel));
              LOG("timer: target=%08x selector=\"%s\" imp=%08x\n", tgt, cs(sel), loop);
              if (!loop) { LOG("tidak ada IMP untuk selector timer\n"); return; }
              { const char *e = getenv("LUXOR_THREAD_SYNC"); if (e) g_thr_sync = atoi(e); }
              { const char *e = getenv("LUXOR_FRAME_TIMEOUT"); if (e && atof(e) > 0) g_frame_timeout = atof(e); }
              { const char *e = getenv("LUXOR_MAX_DT_MS"); if (e) g_max_dt = atof(e) / 1000.0; }
              LOG("langkah waktu game maks per frame: %.0f ms%s\n", g_max_dt * 1000, g_max_dt > 0 ? "" : " (nonaktif)");
              LOG("batas waktu per frame: %.0f s\n", g_frame_timeout);
              LOG("thread guest: mode %s\n", g_thr_sync ? "sync (sampai selesai)" : "bergantian");
              for (int f = 0; frames <= 0 || f < frames; f++) {
                  g_curframe = f;
                  g_trace = (f < 2);                         /* catat setiap panggilan HLE pada 2 frame pertama */
                  if (f < 3) LOG("frame %d mulai\n", f);
                  if (g_prof_report_req) { g_prof_report_req = 0; prof_report(); }
                  audio_pump();
                  cursor_step();
                  {   /* batasi langkah waktu game per frame */
                      double now = mono_s();
                      if (g_last_frame_rt > 0 && g_max_dt > 0) {
                          double dt = now - g_last_frame_rt;
                          if (dt > g_max_dt) { g_time_off += dt - g_max_dt; g_slow_frames++; }
                      }
                      g_last_frame_rt = now;
                  }
                  double ft0 = mono_s();
                  r = call_guest_args(loop, tgt, sel, 0, g_frame_timeout);
                  { double dt = mono_s() - ft0; if (dt > 0.5) LOG("frame %d lama: %.2fs\n", f, dt); }
                  if (r != 2) { LOG("frame %d berhenti, kode=%d (%s)\n", f, r, g_stop_reason); break; }
                  for (int ti = 0; ti < g_nthr; ti++) thread_slice(&g_thr[ti], g_thr_ms);
                  if (f < 3 || f % 30 == 0) LOG("frame %d selesai\n", f);
              }
              LOG("===== BOOTSTRAP M2 SELESAI =====\n");
          }

          /* ------------------------------------------------ diagnostik memori host */
          static void log_file_head(const char *path, int maxlines)
          {
              FILE *f = fopen(path, "r");
              if (!f) { LOG("  %s: tidak bisa dibuka (%s)\n", path, strerror(errno)); return; }
              char line[200];
              for (int i = 0; i < maxlines && fgets(line, sizeof line, f); i++) LOG("  %s: %s", path, line);
              fclose(f);
          }

          static void probe_rwx(void)
          {
              LOG("== Diagnostik memori host ==\n");
              log_file_head("/proc/meminfo", 4);
              log_file_head("/proc/sys/vm/overcommit_memory", 1);
              static const int mbs[] = {512, 256, 128, 64, 32, 16, 8};
              for (size_t i = 0; i < sizeof mbs / sizeof mbs[0]; i++) {
                  size_t sz = (size_t)mbs[i] << 20;
                  void *p = mmap(NULL, sz, PROT_NONE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
                  if (p == MAP_FAILED) { LOG("  probe %3d MB: mmap gagal (%s)\n", mbs[i], strerror(errno)); continue; }
                  int r = mprotect(p, sz, PROT_READ | PROT_WRITE | PROT_EXEC);
                  LOG("  probe %3d MB: %s\n", mbs[i], r == 0 ? "OK (baca+tulis+eksekusi)" : strerror(errno));
                  munmap(p, sz);
              }
          }

