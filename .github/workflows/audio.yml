              LOG("\n== Ringkasan simbol impor sistem ==\n");
              LOG("total %d  | punya handler: %d | data blob: %d | belum diimplementasi (generik): %d (di antaranya C++ '__Z*': %d)\n",
                  g_nhle, with, data, generic, cpp);
