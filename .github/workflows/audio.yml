          }

          /* ---------------------------------------------------------------- heap */
          static uint32_t g_heap_ptr = HEAP_BASE + 0x1000;
          static uint32_t heap_alloc(uint32_t n)
          {
              uint32_t sz = (n + 15) & ~15u;
              if (g_heap_ptr + 16 + sz > HEAP_BASE + HEAP_SIZE) {
                  static int warned; if (warned++ < 5) LOG("!! HEAP GAME PENUH: minta %u byte, terpakai %u MB dari %u MB\n", n, (unsigned)((g_heap_ptr - HEAP_BASE) >> 20), (unsigned)(HEAP_SIZE >> 20));
                  return 0;
              }
              uint32_t h = g_heap_ptr;
              uint8_t *p = g2h(h, 16);
              wbe32(p, n);
              g_heap_ptr += 16 + sz;
              return h + 16;
          }
          static uint32_t heap_size(uint32_t a)
          {
              uint8_t *p = g2h(a - 16, 16);
              return p ? be32(p) : 0;
          }

