              SNDLOG("[snd] SndNewChannel(chanPtr=%08x isi=%08x, synth=%d, init=%08x, callback=%s)\n", a[0], pp ? be32(pp) : 0, (int16_t)a[1], a[2], a[3] ? describe(a[3]) : "-");
              return 0;
          }
          H(h_SndDoCommand) {
