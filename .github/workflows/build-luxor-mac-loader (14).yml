          static void setup_cpu(void)
          {
              uc_err e = uc_open(UC_ARCH_PPC, (uc_mode)(UC_MODE_PPC32 | UC_MODE_BIG_ENDIAN), &g_uc);
              if (e != UC_ERR_OK) { LOG("FATAL: uc_open PPC32 gagal: %s\n", uc_strerror(e)); exit(2); }
              int done = 0;
          #ifdef LUXOR_HAVE_CPU_TABLE
              if (!g_cpu_req) g_cpu_req = getenv("LUXOR_CPU");
              if (g_cpu_req && *g_cpu_req && strcmp(g_cpu_req, "default")) {
                  for (int i = 0; g_cpu_models[i].name; i++) {
                      if (strstr(g_cpu_models[i].name, g_cpu_req)) {
                          e = uc_ctl_set_cpu_model(g_uc, g_cpu_models[i].id);
                          LOG("CPU model (diminta '%s'): %s -> %s\n", g_cpu_req, g_cpu_models[i].name, uc_strerror(e));
                          done = 1;
                          break;
                      }
                  }
                  if (!done) LOG("CPU model '%s' tidak dikenal, pakai bawaan build\n", g_cpu_req);
              } else if (g_cpu_req && !strcmp(g_cpu_req, "default")) {
                  LOG("CPU model: default Unicorn (diminta)\n");
                  done = 1;
              }
          #endif
          #ifdef LUXOR_CPU_MODEL
              if (!done) {
                  e = uc_ctl_set_cpu_model(g_uc, LUXOR_CPU_MODEL);
                  LOG("CPU model: %s -> %s\n", LUXOR_CPU_MODEL_STR, uc_strerror(e));
                  done = 1;
              }
          #endif
              if (!done) LOG("CPU model: default Unicorn (tidak diset)\n");
          #if defined(HAVE_TCG_BUFFER_CTL) || defined(uc_ctl_set_tcg_buffer_size)
              if (g_tcg_mb > 0) {
                  e = uc_ctl_set_tcg_buffer_size(g_uc, (uint32_t)g_tcg_mb * 1024u * 1024u);
                  LOG("TCG buffer: %d MB -> %s\n", g_tcg_mb, uc_strerror(e));
              }
          #else
              LOG("TCG buffer: kontrol tidak tersedia di build ini\n");
          #endif
          }

          /* MSR: FP (bit 13) | VEC (bit 25); FE0/FE1 (bit 11/8) = 0 -> exception FP tidak dikirim.
           * Dipanggil ulang sebelum SETIAP run_guest: Unicorn bisa mereset MSR saat
           * exception/rfi, dan instruksi FP saat MSR.FP=0 membuat Unicorn abort() (SIGNAL 6). */
          static int g_msr_logged;
          static void enable_fpu_altivec(void)
          {
              uint32_t msr = 0;
              uc_reg_read(g_uc, UC_PPC_REG_MSR, &msr);
              uint32_t want = (msr | (1u << 13) | (1u << 25)) & ~((1u << 11) | (1u << 8));
              if (want != msr) uc_reg_write(g_uc, UC_PPC_REG_MSR, &want);
          #ifdef LUXOR_HAVE_FPSCR
              if (!g_msr_logged) { uint32_t z = 0; uc_reg_write(g_uc, UC_PPC_REG_FPSCR, &z); }
          #endif
              if (!g_msr_logged) {
                  uint32_t back = 0;
                  uc_reg_read(g_uc, UC_PPC_REG_MSR, &back);
                  LOG("MSR: awal=%08x tulis=%08x baca-ulang=%08x  FP=%s VEC=%s\n", msr, want, back,
                      (back & (1u << 13)) ? "ON" : "OFF!!", (back & (1u << 25)) ? "ON" : "OFF");
                  g_msr_logged = 1;
              }
          }

          /* exception CPU guest (FP unavailable, program, alignment, dll) dicatat, bukan diam-diam abort */
          static void hook_intr(uc_engine *uc, uint32_t intno, void *ud)
          {
              (void)uc; (void)ud;
              static int n;
              uint32_t pc = RPC();
              if (n++ < 20)
                  LOG("!! exception guest intno=%u di %s (insn %08x)  HLE terakhir=%s\n",
                      intno, describe(pc), rd32(pc), g_lasthle ? g_lasthle : "-");
              g_stop_reason = "exception CPU guest";
              g_stop = 3;
              uc_emu_stop(g_uc);
          }

          static void install_hooks(void)
          {
              uc_hook h1, h2, h3, h4;
              uc_hook_add(g_uc, &h1, UC_HOOK_CODE, (void *)hook_code, NULL, TRAP_BASE, TRAP_BASE + TRAP_SIZE - 1);
              uc_hook_add(g_uc, &h2, UC_HOOK_MEM_READ_UNMAPPED | UC_HOOK_MEM_WRITE_UNMAPPED | UC_HOOK_MEM_FETCH_UNMAPPED,
                          (void *)hook_unmapped, NULL, 1, 0);
              if (g_blocktrace) uc_hook_add(g_uc, &h3, UC_HOOK_BLOCK, (void *)hook_block, NULL, 1, 0);
              if (g_insntrace) uc_hook_add(g_uc, &h4, UC_HOOK_CODE, (void *)hook_insn, NULL, 1, 0);
              uc_hook h5;
              uc_err e = uc_hook_add(g_uc, &h5, UC_HOOK_INTR, (void *)hook_intr, NULL, 1, 0);
              LOG("hook exception: %s\n", uc_strerror(e));
          }
          #endif /* !DRYRUN */


          static const HleDef *hle_def_find(const char *name)
          {
              for (const HleDef *d = g_defs; d->name; d++)
                  if (!strcmp(d->name, name)) return d;
              return NULL;
          }

          /* ----------------------------------------------------------------- main */
          static void print_image_report(Image *im)
          {
              LOG("  [%2d] %-14s slide=%08x  guest=[%08x..%08x)  dep=%d  extrel=%d(addend!=0:%d) rebase=%d lazy=%d nonlazy=%d nl_local+slide=%d odd=%d\n",
                  im->idx, im->short_name, im->slide, im->lo, im->hi, im->ndeps, im->n_extrel, im->n_extrel_addend,
                  im->n_rebase, im->n_lazy, im->n_nonlazy, im->n_nl_local, im->n_odd_reloc);
          }

          int main(int argc, char **argv)
          {
              const char *app = argc > 1 ? argv[1] : "Luxor_Mac/Luxor.app";
              for (int i = 2; i < argc; i++) {
          #ifndef DRYRUN
                  if (!strcmp(argv[i], "--trace")) g_trace = 1;
                  else if (!strcmp(argv[i], "--tcg-mb") && i + 1 < argc) g_tcg_mb = atoi(argv[++i]);
                  else if (!strcmp(argv[i], "--frames") && i + 1 < argc) g_frames = atoi(argv[++i]);
                  else if (!strcmp(argv[i], "--no-boot")) g_noboot = 1;
                  else if (!strcmp(argv[i], "--fast")) g_blocktrace = 0;
                  else if (!strcmp(argv[i], "--insn")) g_insntrace = 1;
                  else if (!strcmp(argv[i], "--cpu") && i + 1 < argc) g_cpu_req = argv[++i];
                  else if (!strcmp(argv[i], "--no-fb")) g_use_fb = 0;
          #endif
              }
              g_logf = fopen("loader_log.txt", "w");
              LOG("luxor_mac_loader M1 (probe) r12-qsort\napp: %s\n", app);
          #ifndef DRYRUN
              signal(SIGABRT, crash_handler);
              signal(SIGSEGV, crash_handler);
              signal(SIGBUS, crash_handler);
              signal(SIGFPE, crash_handler);
              signal(SIGILL, crash_handler);
          #endif

          #ifndef DRYRUN
              probe_rwx();
              setup_cpu();
              signal(SIGTERM, sig_quit);
              signal(SIGINT, sig_quit);
              start_input_thread();
          #endif
              char exe[700];
              snprintf(g_exe_dir, sizeof g_exe_dir, "%s/Contents/MacOS", app);
              snprintf(exe, sizeof exe, "%s/Luxor", g_exe_dir);

              /* region umum */
              map_region("heap", HEAP_BASE, HEAP_SIZE);
              map_region("hle-data", DATA_BASE, DATA_SIZE);
              map_region("hle-trap", TRAP_BASE, TRAP_SIZE);
              wbe32(g2h(TRAP_BASE, 4), 0x4e800020);                      /* slot 0 (sentinel) = blr */
              hle_state_init();
              snprintf(g_app_path, sizeof g_app_path, "%s", app);
              {
                  char cwd[500];
                  if (!getcwd(cwd, sizeof cwd)) snprintf(cwd, sizeof cwd, ".");
                  snprintf(g_appdata, sizeof g_appdata, "%s/appdata", cwd);
                  snprintf(g_shot_dir, sizeof g_shot_dir, "%s/frames", cwd);
                  mkdir(g_shot_dir, 0755);
                  mkdir(g_appdata, 0755);
                  LOG("appdata: %s\n", g_appdata);
              }
              map_region("stack", STACK_TOP - STACK_SIZE, STACK_SIZE);

              /* muat image: exe lebih dulu (indeks 0), lalu framework */
              Image *mainimg = load_image(exe, 1);
              snprintf(mainimg->install, sizeof mainimg->install, "<exe>");
              load_tree(mainimg);

              LOG("\n== Image termuat: %d, export global: %zu ==\n", g_nimg, g_nexp);

              for (int i = 0; i < g_nimg; i++) fixup_image(g_img[i]);
              for (int i = 0; i < g_nimg; i++) objc_register_classes(g_img[i]);   /* exe + framework (MJWindow di core, MJOpenGLView di gfx2d_ogl) */
              /* isi section __DATA,__dyld seperti yang dilakukan dyld asli (crt1 memeriksa ini) */
              for (int i = 0; i < g_nimg; i++) {
                  Image *im = g_img[i];
                  for (int si = 0; si < im->nsects; si++) {
                      Sect *t = &im->sects[si];
                      if (strcmp(t->seg, "__DATA") || strcmp(t->name, "__dyld") || t->size < 8) continue;
                      uint8_t *p = g2h(t->addr + im->slide, 8);
                      if (!p) continue;
                      wbe32(p, hle_symbol("<dyld_lazy_binder>", 0));
                      wbe32(p + 4, hle_symbol("<dyld_func_lookup>", 0));
                      LOG("  __dyld %s: diisi\n", im->short_name);
                  }
              }
              for (int i = 0; i < g_nimg; i++) print_image_report(g_img[i]);
              print_hle_summary();

              LOG("\n== Urutan inisialisasi ==\n");
              for (int i = 0; i < g_norder; i++) {
                  Image *im = g_order[i];
                  for (int s = 0; s < im->nsects; s++) {
                      Sect *t = &im->sects[s];
                      if ((t->flags & 0xff) != 9) continue;
                      for (uint32_t k = 0; k < t->size / 4; k++) {
                          uint8_t *p = g2h(t->addr + im->slide + k * 4, 4);
                          LOG("  %-14s init[%u] = %s\n", im->short_name, k, p ? describe(be32(p)) : "?");
                      }
                  }
              }
              LOG("\nentry exe = %08x (%s)\n", mainimg->entry, describe(mainimg->entry));

          #ifdef DRYRUN
              g_logcut = 0;
              print_unimplemented();
              LOG("\nDRYRUN selesai (emulator tidak dijalankan).\n");
              return 0;
          #else
              enable_fpu_altivec();
              install_hooks();

              /* jalankan initializer: dependensi dulu, exe terakhir */
              for (int i = 0; i < g_norder; i++) {
                  Image *im = g_order[i];
                  for (int s = 0; s < im->nsects; s++) {
                      Sect *t = &im->sects[s];
                      if ((t->flags & 0xff) != 9) continue;
                      for (uint32_t k = 0; k < t->size / 4; k++) {
                          uint8_t *p = g2h(t->addr + im->slide + k * 4, 4);
                          uint32_t fn = p ? be32(p) : 0;
                          if (!fn || fn == 0xffffffffu) continue;
                          LOG("-> init %s[%u] @ %s\n", im->short_name, k, describe(fn));
                          int r = call_guest(fn, 30.0);
                          if (r != 2) { LOG("initializer tidak kembali normal (kode %d): %s\n", r, g_stop_reason); goto done; }
                      }
                  }
              }

              /* stack awal: [argc][argv0][0][envp: kosong][0][apple0][0] */
              {
                  uint32_t sp = STACK_TOP - 0x1000;
                  char path[700];
                  snprintf(path, sizeof path, "%s", exe);
                  uint32_t slen = (uint32_t)strlen(path) + 1;
                  uint32_t sa = sp - 0x400;
                  memcpy(g2h(sa, slen), path, slen);
                  sp -= 0x800;
                  uint8_t *st = g2h(sp, 32);
                  wbe32(st + 0, 1);            /* argc */
                  wbe32(st + 4, sa);           /* argv[0] */
                  wbe32(st + 8, 0);            /* argv terminator */
                  wbe32(st + 12, 0);           /* envp terminator */
                  wbe32(st + 16, sa);          /* apple[0] */
                  wbe32(st + 20, 0);
                  W(1, sp);
                  WLR(RET_SENTINEL);
                  LOG("\n-> start (entry %08x), sp=%08x\n", mainimg->entry, sp);
                  int r = run_guest(mainimg->entry, 120.0);
                  LOG("\nhasil run_guest = %d: %s\n", r, g_stop_reason);
                  if (r == 1 && g_boot && !g_noboot) stage2(g_frames);
              }
          done:
              g_logcut = 0;
              print_call_stats();
              print_unimplemented();
              LOG("\nSelesai.\n");
              fbdev_clear_exit();
              return 0;
          #endif
          }
          LOADER_C_EOF
          cat > src/Luxor_Mac.sh <<'LUXOR_SH_EOF'
          #!/bin/sh
          # Luxor Mac (PowerPC) -> Linux ARM64 | Milestone 1 | peluncur diagnostik v12 (muOS)
          # Skrip ini di ROMS/Ports ; folder "luxor_mac" (berisi luxor_mac_loader dan Luxor_Mac/Luxor.app)
          # dicari otomatis di beberapa lokasi umum.
          DIR="$(cd "$(dirname "$0")" 2>/dev/null && pwd)"
          L1="$DIR/luxor_mac_launcher.txt"

          {
            echo "== peluncur v12 mulai: $(date 2>&1)"
            echo "script : $0"
            echo "DIR    : $DIR"
          } > "$L1" 2>&1

          # --- cari folder game ---
          GAME=""
          for c in "$DIR/luxor_mac" \
                   /mnt/sdcard/ports/luxor_mac /mnt/mmc/ports/luxor_mac /mnt/union/ports/luxor_mac \
                   /mnt/sdcard/ROMS/Ports/luxor_mac /mnt/mmc/ROMS/Ports/luxor_mac /mnt/union/ROMS/Ports/luxor_mac \
                   /mnt/sdcard/ports/luxor_mac_loader /mnt/mmc/ports/luxor_mac_loader; do
            if [ -f "$c/luxor_mac_loader" ]; then GAME="$c"; break; fi
          done
          if [ -z "$GAME" ]; then
            F="$(find /mnt -maxdepth 5 -name luxor_mac_loader 2>/dev/null | head -1)"
            [ -n "$F" ] && GAME="$(dirname "$F")"
          fi

          if [ -z "$GAME" ]; then
            {
              echo "ERROR: luxor_mac_loader TIDAK DITEMUKAN di mana pun."
              echo "-- ls /mnt:";                   ls -la /mnt 2>&1
              echo "-- ls /mnt/sdcard:";            ls -la /mnt/sdcard 2>&1 | head -40
              echo "-- ls /mnt/sdcard/ports:";      ls -la /mnt/sdcard/ports 2>&1 | head -60
              echo "-- ls /mnt/mmc:";               ls -la /mnt/mmc 2>&1 | head -40
              echo "-- ls /mnt/union:";             ls -la /mnt/union 2>&1 | head -40
            } >> "$L1" 2>&1
            exit 1
          fi

          L2="$GAME/luxor_mac_launcher.txt"
          {
            echo "GAME   : $GAME"
            echo "uname  : $(uname -a 2>&1)"
            echo "-- isi GAME:";       ls -la "$GAME" 2>&1
            echo "-- isi Luxor_Mac:";  ls -la "$GAME/Luxor_Mac" 2>&1
          } >> "$L1" 2>&1

          cd "$GAME" || { echo "ERROR: cd ke $GAME gagal" >> "$L1"; exit 1; }

          BIN="$GAME/luxor_mac_loader"
          chmod +x "$BIN" 2>/dev/null
          if [ ! -x "$BIN" ]; then
            echo "binary tidak executable di SD, disalin ke /tmp" >> "$L1"
            cp "$BIN" /tmp/luxor_mac_loader && chmod +x /tmp/luxor_mac_loader && BIN=/tmp/luxor_mac_loader
          fi

          APP="$GAME/Luxor_Mac/Luxor.app"
          [ -d "$APP" ] || APP="$GAME/Luxor.app"
          echo "BIN: $BIN" >> "$L1"
          echo "APP: $APP" >> "$L1"
          [ -d "$APP/Contents/MacOS" ] || echo "PERINGATAN: $APP/Contents/MacOS tidak ada" >> "$L1"

          rm -rf "$GAME/frames"
          # batas waktu darurat (detik); 0 = tanpa batas. Keluar manual: SELECT+START atau tahan MENU 1 detik
          export LUXOR_TIMEOUT="${LUXOR_TIMEOUT:-300}"
          { echo "-- memori:"; head -4 /proc/meminfo 2>&1; echo "overcommit: $(cat /proc/sys/vm/overcommit_memory 2>&1)"; echo "ulimit -v: $(ulimit -v 2>&1)"; } >> "$L1" 2>&1
          # buffer JIT: dari besar ke kecil sampai berhasil dialokasikan
          MB=64
          for M in 64 32 16 8; do
            MB=$M
            "$BIN" "$APP" --tcg-mb $MB --frames ${LUXOR_FRAMES:-0} > "$GAME/loader_stdout.txt" 2>&1
            RC=$?
            echo "percobaan buffer JIT ${MB}MB -> exit code: $RC" >> "$L1"
            grep -q "Could not allocate dynamic translator" "$GAME/loader_stdout.txt" || break
          done
          cp "$GAME/loader_log.txt" "$GAME/loader_log_cpu_build.txt" 2>/dev/null

          # kalau abort/crash (exit >=128), coba model CPU lain; tiap percobaan punya log sendiri
          if [ "$RC" -ge 128 ]; then
            for CPU in 750 7400 7410 7450 default; do
              "$BIN" "$APP" --tcg-mb $MB --frames ${LUXOR_FRAMES:-0} --cpu $CPU > "$GAME/loader_stdout_cpu_$CPU.txt" 2>&1
              RC=$?
              cp "$GAME/loader_log.txt" "$GAME/loader_log_cpu_$CPU.txt" 2>/dev/null
              echo "percobaan CPU $CPU -> exit code: $RC" >> "$L1"
              [ "$RC" -lt 128 ] && break
            done
          fi
          echo "loader selesai, exit code terakhir: $RC" >> "$L1"
          echo "-- screenshot frames/:" >> "$L1"; ls -la "$GAME/frames" >> "$L1" 2>&1
          cp "$L1" "$L2" 2>/dev/null
          exit 0
          LUXOR_SH_EOF
          wc -c src/loader.c src/Luxor_Mac.sh

      - name: Pasang tool build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3 file

      - name: Build Unicorn (hanya PPC, statis)
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/unicorn-engine/unicorn.git
          cmake -S unicorn -B unicorn/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNICORN_ARCH=ppc \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_TESTS=OFF
          cmake --build unicorn/build -j"$(nproc)"

      - name: Build loader
        run: |
          SRC=src/loader.c
          grep -oE 'UC_CPU_PPC32_[A-Za-z0-9_]+' unicorn/include/unicorn/ppc.h | sort -u > models.txt || true
          MODEL=""
          for pat in 7447A 7447 7457 7450 7455 7410 7400 750 745; do
            m=$(grep -E "UC_CPU_PPC32_${pat}(_|$)" models.txt | head -1 || true)
            if [ -n "$m" ]; then MODEL="$m"; break; fi
          done
          echo "Model CPU terpilih: '${MODEL}'"
          EXTRA=()
          if [ -n "$MODEL" ]; then
            EXTRA=("-DLUXOR_CPU_MODEL=$MODEL" "-DLUXOR_CPU_MODEL_STR=\"$MODEL\"")
          fi
          grep -q "UC_PPC_REG_FPR0" unicorn/include/unicorn/ppc.h && EXTRA+=("-DLUXOR_HAVE_FPR")
          grep -q "UC_PPC_REG_FPSCR" unicorn/include/unicorn/ppc.h && EXTRA+=("-DLUXOR_HAVE_FPSCR")
          # tabel semua model CPU PPC32 supaya bisa dipilih saat runtime (--cpu / LUXOR_CPU)
          {
            echo 'static const struct { const char *name; int id; } g_cpu_models[] = {'
            while read -r m; do [ -n "$m" ] && echo "  {\"$m\", $m},"; done < models.txt
            echo '  {0, 0}'
            echo '};'
          } > src/cpu_models.h
          if [ -s models.txt ]; then EXTRA+=("-DLUXOR_HAVE_CPU_TABLE" "-Isrc"); fi
          echo "jumlah model CPU: $(wc -l < models.txt)"
          grep -q "uc_ctl_set_tcg_buffer_size" unicorn/include/unicorn/unicorn.h && EXTRA+=("-DHAVE_TCG_BUFFER_CTL")
          echo "Flag: ${EXTRA[*]}"
          mkdir -p out/luxor_mac
          gcc -O2 -Wall -Iunicorn/include "${EXTRA[@]}" "$SRC" -o out/luxor_mac/luxor_mac_loader \
            -static -Wl,--start-group $(find unicorn/build -name '*.a' | tr '\n' ' ') -Wl,--end-group -lpthread -lm
          strip out/luxor_mac/luxor_mac_loader
          file out/luxor_mac/luxor_mac_loader

      - name: Uji jalan (harus gagal rapi, tidak ada game di sini)
        run: |
          cd out/luxor_mac
          ./luxor_mac_loader /tidak/ada/Luxor.app || true
          head -20 loader_log.txt || true
          rm -f loader_log.txt; rm -rf appdata

      - name: Siapkan paket
        run: |
          cp src/Luxor_Mac.sh out/Luxor_Mac.sh
          chmod +x out/Luxor_Mac.sh out/luxor_mac/luxor_mac_loader
          echo "Salin folder Luxor_Mac/ (berisi Luxor.app) ke dalam luxor_mac/" > out/luxor_mac/BACA_SAYA.txt
          find out -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: luxor-mac-loader
          path: out/
