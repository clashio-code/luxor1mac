name: build-luxor-mac-loader-m1

on:
  workflow_dispatch:
  push:
    paths:
      - "luxor_mac_src/**"
      - ".github/workflows/build-luxor-mac-loader-m1.yml"

jobs:
  build:
    # runner ARM64 native supaya hasilnya langsung ARM64 (RG40XXV)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Pasang tool build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3

      - name: Build Unicorn (hanya PPC, statis)
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/unicorn-engine/unicorn.git
          cmake -S unicorn -B unicorn/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNICORN_ARCH=ppc \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_TESTS=OFF
          cmake --build unicorn/build -j"$(nproc)"
          find unicorn/build -name '*.a'

      - name: Diagnostik header PPC Unicorn
        run: |
          echo "--- register PPC ---"
          grep -nE "UC_PPC_REG_(PC|0|1|3|31|LR|CTR|MSR)\b" unicorn/include/unicorn/ppc.h || true
          echo "--- model CPU PPC32 ---"
          grep -nE "UC_CPU_PPC32_(750|7400|7447|7447A|7450|7455)" unicorn/include/unicorn/ppc.h || true

      - name: Build loader
        run: |
          MODEL=""
          for m in UC_CPU_PPC32_7447A UC_CPU_PPC32_7447 UC_CPU_PPC32_7450 UC_CPU_PPC32_7400 UC_CPU_PPC32_750; do
            if grep -qE "\b$m\b" unicorn/include/unicorn/ppc.h; then MODEL=$m; break; fi
          done
          echo "Model CPU terpilih: '${MODEL}'"
          EXTRA=""
          if [ -n "$MODEL" ]; then EXTRA="-DLUXOR_CPU_MODEL=$MODEL -DLUXOR_CPU_MODEL_STR=\"$MODEL\""; fi
          eval gcc -O2 -Wall -Iunicorn/include $EXTRA luxor_mac_src/loader.c -o luxor_mac_loader \
            -static -Wl,--start-group $(find unicorn/build -name '*.a' | tr '\n' ' ') -Wl,--end-group -lpthread -lm
          strip luxor_mac_loader
          file luxor_mac_loader
          ls -l luxor_mac_loader

      - name: Uji jalan (harus gagal rapi karena tidak ada game di sini)
        run: |
          ./luxor_mac_loader /tidak/ada/Luxor.app || true
          cat loader_log.txt || true

      - name: Siapkan paket
        run: |
          mkdir -p out
          cp luxor_mac_loader out/
          cp luxor_mac_src/Luxor_Mac.sh out/
          chmod +x out/luxor_mac_loader out/Luxor_Mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: luxor-mac-loader-m1
          path: out/
